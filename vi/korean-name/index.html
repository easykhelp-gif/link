<style>
:root{
  --bg:#111526; --bg2:#181d34; --panel:#1f2747; --line:#333f6a;
  --ink:#f4efe4; --ink2:#cbc5b7; --ink3:#918b80;
  --gold:#e0bd63; --gold2:#b8954a; --cream:#f6eddb; --brown:#2a2418;
  --e0:#7fd3a6; --e1:#ff8a6b; --e2:#f0c35a; --e3:#e6ecf2; --e4:#86b8ec;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 50% -200px,#26305a 0%,var(--bg) 60%) no-repeat,var(--bg)}
main{max-width:560px;margin:0 auto;padding:0 16px 64px}
h1,h2,h3{font-family:'Noto Serif KR',serif;line-height:1.3;margin:0;word-break:keep-all}
h1{font-size:31px;font-weight:900}
h2{font-size:22px;font-weight:900;margin:38px 0 6px}
h3{font-size:16.5px;font-weight:700;margin:0 0 6px}
p{margin:.5em 0;word-break:keep-all}
.muted{color:var(--ink2)} .tiny{font-size:12.5px;color:var(--ink3)}
.copy{text-align:center;font-size:11.5px;color:var(--ink3);padding:28px 16px 36px;letter-spacing:.2px}
.hz{font-size:.8em;color:var(--ink3);font-weight:500;white-space:nowrap}
.kicker{display:inline-block;font-size:12px;letter-spacing:3px;color:var(--gold);border:1px solid var(--gold2);border-radius:999px;padding:2px 12px;margin-bottom:12px}
.no{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1d1a12;font-size:14px;font-weight:900;margin-right:8px;vertical-align:3px;font-family:'Noto Sans KR',sans-serif}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;background:var(--gold);color:#1d1a12;margin-top:16px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.86) rotate(-3deg)}to{opacity:1;transform:none}}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* 첫 화면 */
.hero{text-align:center;padding:30px 0 6px}
.hero .sub{font-size:16px;color:var(--gold);margin:10px 0 0;font-weight:700}
.story{text-align:left;font-size:14px;color:var(--ink2);line-height:1.75;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 2px;margin:4px 0 0}
.story p{margin:.45em 0}
.story b{color:var(--ink)}
.lamp{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:500;line-height:1.8;color:var(--cream);margin:14px 6px 0}
.cta{margin:34px 0 0;padding:20px 16px;text-align:center;border:1px solid var(--gold2);border-radius:18px;background:linear-gradient(160deg,#2a3360,#1d2443)}
.cta p{margin:0;font-family:'Noto Serif KR',serif;font-size:17px;line-height:1.7}
.formh{text-align:center;margin:30px 0 4px;font-size:20px}
.fan{position:relative;height:236px;margin:20px auto 6px;width:300px}
.fan svg{position:absolute;width:120px;top:8px;left:90px;filter:drop-shadow(0 12px 20px rgba(0,0,0,.5))}
.fan svg:nth-child(1){transform:rotate(-14deg) translateX(-72px)}
.fan svg:nth-child(2){animation:float 4s ease-in-out infinite}
.fan svg:nth-child(3){transform:rotate(14deg) translateX(72px)}
.stat{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;background:linear-gradient(135deg,#2a3360,#1f2747);border:1px solid var(--gold2);border-radius:16px;padding:14px 16px;margin:16px 0}
.stat .big{font-family:'Noto Serif KR',serif;font-size:38px;font-weight:900;color:var(--gold);line-height:1}

.steps3{display:grid;gap:8px;margin:14px 0;text-align:left}
.steps3 div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.basis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px;text-align:left}
.basis div{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;color:var(--ink2);background:#181e38}
.basis b{display:block;color:var(--gold);font-size:13.5px;margin-bottom:2px}

/* 입력 */
form{margin-top:18px}
form .row{display:grid;gap:6px;margin:14px 0}
label.l{font-size:13.5px;font-weight:700;color:var(--ink2)}
label.l em{font-style:normal;color:var(--gold)}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{font:inherit;font-size:16px;font-weight:700;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink2);cursor:pointer}

.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.chk[hidden]{display:none}
.chk input{width:18px;height:18px}
.inline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.err{color:#ff9b8a;font-size:14px;min-height:1.2em}

/* 계산 중 */
#loading{position:fixed;inset:0;z-index:50;background:rgba(10,12,24,.94);display:none;place-items:center;text-align:center}
#loading.on{display:grid}
#loading .cards{display:flex;gap:10px;justify-content:center;margin-bottom:18px;perspective:600px}
#loading svg{width:78px;animation:flip 1.1s ease-in-out infinite}
#loading svg:nth-child(2){animation-delay:.18s}
#loading svg:nth-child(3){animation-delay:.36s}
#loading .msg{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;color:var(--gold);min-height:1.6em}

/* 결과 */
#result{display:none;animation:rise .5s ease both}
.top{position:sticky;top:0;z-index:20;background:rgba(17,21,38,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.home{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-decoration:none;border-radius:10px;-webkit-tap-highlight-color:transparent}
.home:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.klogo{flex:none;width:30px;height:30px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.65)) drop-shadow(0 0 8px rgba(224,189,99,.35))}
.brand{font-family:'Noto Serif KR',serif;font-weight:900;font-size:19px;letter-spacing:.5px;color:var(--gold);padding:2px 0;
  background:linear-gradient(180deg,#fff3cf 0%,#ecc970 48%,#c08f30 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.65)) drop-shadow(0 0 9px rgba(224,189,99,.38))}
.home:hover .brand{filter:drop-shadow(0 1px 0 rgba(0,0,0,.65)) drop-shadow(0 0 12px rgba(224,189,99,.6))}
html:not([lang="ko"]) .brand{font-size:16px;letter-spacing:0}
.mycard{display:grid;grid-template-columns:116px 1fr;gap:16px;align-items:center;margin-top:12px;padding:14px 14px 14px 12px;border-radius:20px;border:1px solid var(--line);border-color:color-mix(in srgb,var(--c) 45%,transparent);background:#151a33;background:radial-gradient(130% 150% at 0% 50%,color-mix(in srgb,var(--c) 24%,transparent),transparent 72%),#151a33}
.mycard svg{width:116px;filter:drop-shadow(0 14px 24px rgba(0,0,0,.5));animation:pop .7s cubic-bezier(.2,.8,.2,1.2) both}
.mycard .mi{min-width:0}
.mycard .ml{font-size:12.5px;font-weight:700;color:var(--c);letter-spacing:.5px}
.mycard .nm{font-family:'Noto Serif KR',serif;font-size:34px;font-weight:900;line-height:1.2;margin-top:2px;color:var(--cream)}
.mycard .nmh{display:inline-block;white-space:nowrap;font-size:22px;font-weight:700;color:var(--c);margin-left:8px}
html:not([lang="ko"]) .mycard .nm{font-size:27px}
html:not([lang="ko"]) .mycard .nmh{font-size:19px;margin-left:6px}
html:not([lang="ko"]) .headline{font-size:19px}
html:not([lang="ko"]) .headline b,html:not([lang="ko"]) .headline .hn{font-size:22px}
.mycard .mm{font-size:15px;line-height:1.5;color:var(--ink2);margin:6px 0 0;word-break:keep-all}
.mycard .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
@media (min-width:520px){.mycard{grid-template-columns:136px 1fr;gap:24px;padding:18px 24px 18px 18px}.mycard svg{width:136px}.mycard .nm{font-size:42px}.mycard .nmh{font-size:26px}.mycard .mm{font-size:16.5px}}
.cntbox{margin-top:14px;padding:18px 8px 12px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.035)}
.cntbox .orbs{margin:16px 0 0;gap:4px}
@media (max-width:400px){.cntbox{padding-left:4px;padding-right:4px}.cntbox .orb{width:50px;height:50px}.cntbox .orb .ei{width:24px;height:24px}}
.tagc{font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;background:#2b3460;color:var(--ink2)}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.pcol{display:grid;gap:8px}
.ph{font-size:12px;color:var(--ink3);text-align:center;white-space:nowrap}
.tile{position:relative;border-radius:12px;padding:8px 4px;text-align:center;background:#252e55;border:2px solid transparent}
.tile .k{font-family:'Noto Serif KR',serif;font-size:27px;font-weight:900;line-height:1.15}
.tile .w{font-size:12.5px;font-weight:700}
.tile.me{border-color:var(--gold)}
.tile .tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1d1a12;font-size:10.5px;font-weight:900;border-radius:999px;padding:0 8px;white-space:nowrap}
.tile.empty{opacity:.45}
.e0{color:var(--e0)}.e1{color:var(--e1)}.e2{color:var(--e2)}.e3{color:var(--e3)}.e4{color:var(--e4)}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:58px 1fr 30px;align-items:center;gap:8px;font-size:14.5px}
.bar .track{height:14px;border-radius:999px;background:#2a3258;overflow:hidden}
.bar .fill{height:100%;border-radius:999px;transition:width .8s ease}
.bar.need b{color:var(--gold)}
.yy{display:flex;height:26px;border-radius:999px;overflow:hidden;margin-top:12px;font-size:12.5px;font-weight:700}
.yy .y{background:#f1e6c8;color:var(--brown);display:grid;place-items:center}
.yy .n{background:#0b0e1c;color:#d9d3c5;display:grid;place-items:center;border:1px solid var(--line)}
.read p{margin:10px 0}
.how{margin-top:16px}
.how p{font-size:14px;color:var(--ink2);margin:8px 0;display:grid;grid-template-columns:44px 1fr;gap:8px}
.how p b{color:var(--gold);font-size:13px}
.read .key{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:900;color:var(--gold)}
.better{background:var(--cream);color:var(--brown);border-radius:16px;padding:16px;margin:14px 0}
.better h3{color:var(--brown)}
.better p{font-size:14.5px}
.pairs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.pairs div{background:#efe2c6;border-radius:10px;padding:8px 2px;text-align:center;font-size:12px;color:#6a5a3a}
.pairs b{display:block;font-size:15px;color:var(--brown)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:3px;border:1px solid #0003}
.names{display:grid;gap:14px;margin-top:12px}
.namecard{position:relative;padding:20px 16px 16px;text-align:center;border-radius:18px;background:linear-gradient(160deg,#f8f0de,#eee0c1);color:var(--brown);border:3px solid #c9a457;cursor:pointer;box-shadow:0 14px 28px rgba(0,0,0,.35);animation:pop .6s cubic-bezier(.2,.8,.2,1.2) both}
.namecard:nth-child(2){animation-delay:.12s}.namecard:nth-child(3){animation-delay:.24s}
.namecard.sel{outline:3px solid var(--gold);outline-offset:3px}
.namecard .rank{position:absolute;top:10px;left:12px;font-size:12px;font-weight:900;color:#8a6a2a}
.namecard .kind{position:absolute;top:10px;right:12px;font-size:11.5px;font-weight:900;color:#fff;background:#8a6a2a;border-radius:999px;padding:1px 9px}
.namecard .kind.w{background:#3f7f5a}
.namecard .ko{font-family:'Noto Serif KR',serif;font-size:42px;font-weight:900;letter-spacing:5px;line-height:1.15;margin-top:6px}
.namecard .ro{font-size:15.5px;font-weight:700;color:#5a4a2a}
.namecard .hj{font-size:15px;color:#7a6a4a;margin-top:2px}
.namecard .why{font-size:14.5px;margin:10px 0 0;text-align:left;background:#fff8ea;border-radius:12px;padding:10px 12px;line-height:1.6}
.namecard .why .gain{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(138,122,90,.35);font-weight:600}
.chips{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
.chips .c0{background:#cfe9d9}.chips .c1{background:#f8d1c4}.chips .c2{background:#f3e0a6}.chips .c3{background:#e2e6ea}.chips .c4{background:#cfe0f3}
.namecard .act{display:flex;gap:8px;justify-content:center;margin-top:12px}
.namecard .act button{font:inherit;font-size:13.5px;font-weight:700;border:1px solid #c9a457;background:#fff8ea;color:var(--brown);border-radius:999px;padding:5px 14px;cursor:pointer}
.share{display:grid;justify-items:center;gap:10px;margin-top:18px}
.share img{width:min(78vw,280px);border-radius:16px;box-shadow:0 18px 30px rgba(0,0,0,.5)}
.sharebtns{display:flex;gap:8px;justify-content:center;margin-top:4px}
.sbtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:96px;height:38px;padding:0 14px;border-radius:999px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;border:0}
.sbtn svg{width:15px;height:15px;flex:none}
.sbtn.save{background:var(--cream);color:#2a2418}
.sbtn.send{background:var(--gold);color:#1d1a12;box-shadow:0 6px 16px rgba(224,189,99,.3)}
.sbtn:active{transform:translateY(1px)}
.sbtn:disabled{opacity:.9;cursor:default;font-size:13px}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
summary{cursor:pointer;font-weight:700}
details ol{padding-left:20px;margin:8px 0}
details li{margin:10px 0;font-size:14.5px;color:var(--ink2)}
details li b{color:var(--ink)}
/* 11/13 개편: 첫 화면 이야기, 기운 구슬, 풀이, 스크롤 등장 */
@keyframes sweep{from{background-position:100% 0}to{background-position:0 0}}
@keyframes roll{to{transform:translateY(calc(var(--n) * -52px))}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hero{padding:24px 0 0}
.hero h1{font-size:36px;background:linear-gradient(100deg,var(--cream) 38%,#fff3c4 50%,var(--cream) 62%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 2.4s ease .3s both}
.hero .sub{font-size:15.5px;color:var(--ink2);font-weight:500;line-height:1.75;margin-top:12px}
.tt{background:linear-gradient(100deg,var(--ink) 40%,#ffe9a8 50%,var(--ink) 60%);background-size:260% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.in .tt,.in.tt{animation:sweep 1.6s ease .25s both}
.blk{margin:52px 0 0}
.ih{font-size:23px;margin:0 0 12px;line-height:1.42}
.ih small{display:block;font-family:'Noto Sans KR',sans-serif;font-size:12px;letter-spacing:3px;color:var(--gold);font-weight:700;margin-bottom:8px}
.blk p{font-size:15px;color:var(--ink2);line-height:1.85}
.blk p b{color:var(--ink)}
.srcl{font-size:12px!important;color:var(--ink3)!important;margin:6px 0 0!important;line-height:1.6!important}
.srcl a{color:var(--ink3);text-underline-offset:2px}
/* 첫 화면 다섯 기운 */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.horbs{display:flex;justify-content:center;gap:12px;margin:16px 0 0}
form{margin-top:8px}
form>.row{margin:12px 0}
.err:empty{min-height:0}
.horbs span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--c);border:1.5px solid var(--c);background:#161c36;box-shadow:0 0 18px -4px var(--c);animation:bob 3.6s ease-in-out var(--d) infinite}
.horbs .ei{width:21px;height:21px}
/* 입력 두 칸 */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.row2>.row{margin:0;align-content:start}
/* 입력 이름표: 버튼 글자와 구분되게 밝고 크게, 버튼 글자는 한 단계 낮춤 */

.lh label.l,.seg.mini button{white-space:nowrap}

.row2>.row>label.l:first-child{min-height:27px;display:flex;align-items:center}
.seg.mini{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:999px;background:var(--bg2)}
.seg.mini button{position:relative;font-size:12.5px!important;font-weight:700;padding:2px 10px;border:0;border-radius:0;background:transparent;color:var(--ink)}
.seg.mini button:first-child{border-radius:999px 0 0 999px}.seg.mini button:last-child{border-radius:0 999px 999px 0}
/* 보이는 크기는 그대로, 누르는 곳만 위아래 44px로 넓힘 */
.seg.mini button::after{content:'';position:absolute;left:0;right:0;top:-11px;bottom:-11px}
.seg.mini button[aria-pressed="true"]{background:var(--gold);color:#1d1a12}
.opt{font-size:11px;font-weight:700;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin-left:4px;vertical-align:1px}
.exl{margin:14px 0 -4px}
.exl span{font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--gold);border:1px solid var(--gold2);border-radius:999px;padding:1px 10px}
/* 생년월일·시각: 고르기 상자. 날짜는 연·월·일 세 칸, 시각은 시·분 두 칸 */
.row2.dt{grid-template-columns:1fr}
.dsel{display:grid;grid-template-columns:1.5fr 1.2fr 1fr;gap:8px}
.dsel.t{grid-template-columns:1fr 1fr}
.dsel select{min-width:0;padding:12px 8px}
.dsel select:disabled{opacity:.45}
/* 생일에서 이름까지 */
.blk{margin:56px 0 0}
.lead{font-size:15.5px;color:var(--ink2);line-height:1.8;margin:0 0 4px}
.flow{display:grid;margin-top:16px}
.fs{display:grid;grid-template-columns:30px 1fr;gap:14px;padding:18px 16px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.fs .n{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#1d1a12;font-weight:900;font-size:14px;display:grid;place-items:center}
.fs .lab{font-size:12px;letter-spacing:2px;font-weight:900;color:var(--gold);line-height:30px}
.fs .cap{font-size:15px;color:var(--ink);line-height:1.65;margin:10px 0 0;word-break:keep-all}
.fs .cap b{color:var(--c,var(--gold))}
.farr{display:grid;place-items:center;height:30px;color:var(--gold)}
.farr svg{width:18px;height:18px;animation:bob 2.2s ease-in-out infinite}
.dchip{display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:8px;padding:8px 14px;border-radius:12px;border:1px dashed var(--gold2);background:#181e38}
.dchip b{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:900}
.dchip span{font-size:14.5px;color:var(--ink2);font-weight:700}
.fs .orbs{margin:12px 0 0;gap:4px}
.fs .orb{width:44px;height:44px}
.fs .orb .ei{width:21px;height:21px}
.fs .ow{margin-top:2px}
.fs .ow .on{font-size:16px}
.nm2{margin-top:8px;font-family:'Noto Serif KR',serif;font-size:34px;font-weight:900;letter-spacing:4px;line-height:1.2;color:var(--cream)}
.nm2 .hz{letter-spacing:1px}
/* 한국의 사주 */
.uses{display:grid;gap:10px;margin-top:16px}
.use{display:grid;grid-template-columns:46px 1fr;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#232c52,#1a2142);border:1px solid var(--line)}
.use .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--gold);background:rgba(224,189,99,.1);border:1px solid var(--gold2)}
.use .ic svg{width:24px;height:24px}
.use b{font-size:16px}
.use p{margin:2px 0 0;font-size:14.5px;color:var(--ink2);line-height:1.65;word-break:keep-all}
.acc{margin-top:14px;padding:4px 16px 6px;border-radius:16px;border:1px solid var(--line);background:#181e38}
.acch{font-size:13px;font-weight:700;color:var(--ink3);padding-top:10px}
.acc .r{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:15px}
.acc .r+.r{border-top:1px dashed var(--line)}
.acc .t{flex:none;font-size:11px;font-weight:900;letter-spacing:1px;border-radius:999px;padding:1px 9px;background:#2b3460;color:var(--ink2)}
.acc .r.hl .t{background:var(--gold);color:#1d1a12}
.acc .r.hl b{color:var(--gold)}
.endcta{margin:44px 0 0;text-align:center}
.endcta p{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;margin:0}
/* 결과 ① 끝: 이름에 넣을 기운 */
.keyline{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 0;padding:12px;border-radius:14px;border:1px solid var(--gold2);background:linear-gradient(90deg,rgba(224,189,99,.14),rgba(224,189,99,.04));font-size:15px;color:var(--ink2)}
.keyline b{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:900;color:var(--c)}
.keyline .ei{width:22px;height:22px;color:var(--c)}
/* 입력 */
.btn.off{opacity:.5}
.seg.need{animation:shake .45s}
.seg.need button{border-color:var(--gold)}
/* ① 기운 구슬 */
.headline{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:900;line-height:1.55;margin:0 8px;text-align:center;word-break:keep-all;text-wrap:balance}
.headline b,.headline .hn{font-size:25px}
.headline .hn{color:var(--gold)}
.orbs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 4px}
.ob{display:grid;justify-items:center;align-content:start;text-align:center;gap:3px;color:var(--c)}
.orb{position:relative;width:56px;height:56px;border-radius:50%;border:2px solid var(--c);background:#161c36;display:grid;place-items:center}
.orb .lq{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.orb .lv{position:absolute;inset:0;background:linear-gradient(180deg,var(--c),#0000 140%);opacity:.6;transform:scaleY(0);transform-origin:bottom;transition:transform 1.4s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.in .orb .lv{transform:scaleY(var(--f))}
.orb .ei{position:relative;width:26px;height:26px}
.ob.zero .orb{border-style:dashed;opacity:.6}
.ob.many .orb{box-shadow:0 0 20px var(--c)}
.ob.me .orb{outline:2px solid var(--gold);outline-offset:3px}
.metag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1d1a12;font-size:10.5px;font-weight:900;border-radius:999px;padding:0 7px;z-index:2;line-height:1.6}
.ow{font-size:13px;font-weight:700;margin-top:4px}
.ow .on{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:900;color:var(--ink);margin-left:2px}
.ost{min-height:19px}
.ost i{font-style:normal;font-size:11px;font-weight:900;border-radius:999px;padding:1px 8px}
.ob.many .ost i{background:var(--c);color:#111}
.ob.zero .ost i{background:#40262a;color:#ff9b8a}
.orl{font-size:11px;color:var(--ink3);line-height:1.35;word-break:keep-all}
.p8h{font-size:15px;margin:22px 0 4px}
.tile{color:var(--c)}
.tile .ei{display:block;width:20px;height:20px;margin:2px auto 0}
.tile .k{font-size:22px}
.tile .snd{font-size:12px;color:var(--ink3);font-weight:500}
/* ② 풀이 */
.thesis{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:900;line-height:1.55;margin:14px 0 8px;padding:16px 16px 16px 18px;border-left:4px solid var(--gold);background:linear-gradient(90deg,rgba(224,189,99,.13),transparent);word-break:keep-all}
.dmread{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.icb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#161c36;border:2px solid var(--c);color:var(--c)}
.icb .ei{width:24px;height:24px}
.dmread b{font-size:15px}
.dmread p{margin:2px 0 0;font-size:15.5px}
.rrows{display:grid;gap:10px;margin:12px 0}
.rrow{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:13px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c)}
.rrow.none .icb{border-style:dashed;opacity:.75}
.rrow .rh{font-size:13.5px;font-weight:700;color:var(--c)}
.rrow .rh i{font-style:normal;font-size:11px;font-weight:900;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:1px}
.rrow.many .rh i{background:var(--c);color:#111}
.rrow.none .rh i{background:#40262a;color:#ff9b8a}
.rrow p{margin:3px 0 0;font-size:15px;line-height:1.7;color:var(--ink)}
.power h3{margin-bottom:2px}
.pl{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-top:10px}
.pl span:first-child{color:#8fe0b4}.pl span:last-child{color:#aab3d6}
.sb{display:flex;height:16px;border-radius:999px;overflow:hidden;margin:6px 0 10px;background:#2a3258}
.sb .a{background:linear-gradient(90deg,#3f9a6b,#6fd09c);width:0;transition:width 1.3s cubic-bezier(.2,.7,.2,1) .2s}
.in .sb .a{width:var(--w)}
.verdict{display:inline-block;font-weight:900;border-radius:999px;padding:1px 12px;background:var(--gold);color:#1d1a12;font-size:14px;margin-right:4px}
.keyc{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;margin:16px 0;padding:16px;border-radius:18px;border:1px solid var(--gold);background:radial-gradient(120% 140% at 0% 0%,rgba(224,189,99,.2),transparent 60%),var(--panel)}
.keyc .big{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--c);color:var(--c);box-shadow:0 0 28px var(--c);background:#161c36}
.keyc .big .ei{width:40px;height:40px}
.keyc .k1{font-size:13px;color:var(--ink2)}
.keyc .k2{font-family:'Noto Serif KR',serif;font-size:25px;font-weight:900;color:var(--c);line-height:1.3}
.keyp{font-size:15px;margin:8px 0}
.yyread{font-size:13.5px;color:var(--ink2);margin:8px 0 0}
.src{font-size:12.5px;color:var(--ink3)}
.src .hz,.tiny .hz{white-space:normal}
.dolist{margin:12px 0 0;display:grid;gap:6px}
.dolist p{margin:0;display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:14.5px}
.dolist b{color:#6a5a3a;font-size:13px}
/* ③ 칩 */
.chips button{font:inherit;display:flex;align-items:center;gap:10px;text-align:left;min-height:44px;border-radius:12px;padding:7px 8px 7px 12px;background:#e8d8b4;color:#4a3a1a;border:1px solid rgba(90,70,30,.18);cursor:pointer;box-shadow:0 2px 0 rgba(90,70,30,.18)}
.chips button .ct{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:10px;line-height:1.35}
.chips button small{flex:none;font-size:12px;font-weight:700;color:#7a6236}
.chips button b{text-align:right}
.chips button b{font-size:13.5px;font-weight:800}
.chips button::after{content:'+';flex:none;width:22px;height:22px;border-radius:50%;background:#8a6a2a;color:#fff;font-size:17px;font-weight:700;line-height:22px;text-align:center}
.chips button[aria-expanded="true"]{border-color:#8a6a2a;box-shadow:0 0 0 1.5px #8a6a2a}
.chips button[aria-expanded="true"]::after{content:'−'}
.chiphint{font-size:12px;font-weight:700;color:#8a6a2a;margin:12px 0 0;display:flex;align-items:center;justify-content:center;gap:5px}
.chiphint::before{content:'+';width:16px;height:16px;border-radius:50%;background:#8a6a2a;color:#fff;font-size:13px;line-height:16px;text-align:center}
.glyphs{display:flex;justify-content:center;gap:10px;margin-top:10px}
.glyph{min-width:92px;max-width:46%;padding:7px 12px 8px;border-radius:12px;background:#fff8ea;border:1px solid rgba(90,70,30,.2)}
.glyph .g{display:block;font-family:'Noto Serif KR',serif;font-size:32px;font-weight:700;line-height:1.15;color:#3a2a10}
.glyph .gm{display:block;font-size:13.5px;font-weight:700;color:#4a3a1a;margin-top:2px;line-height:1.35}
.glyph .gm i{font-style:normal;font-weight:800;color:#8a6a2a}
.glyph.c0{background:#cfe9d9}.glyph.c1{background:#f8d1c4}.glyph.c2{background:#f3e0a6}.glyph.c3{background:#e2e6ea}.glyph.c4{background:#cfe0f3}
.chips .c0{background:#cfe9d9}.chips .c1{background:#f8d1c4}.chips .c2{background:#f3e0a6}.chips .c3{background:#e2e6ea}.chips .c4{background:#cfe0f3}
.chipnote{font-size:13.5px;text-align:left;background:#f3e8cf;border-left:3px solid #c9a457;border-radius:8px;padding:8px 10px;margin:8px 0 0;line-height:1.6}
.namecard .mean{font-size:14px;color:#5a4a2a;margin-top:4px}
/* 스크롤 등장 */
.rv{opacity:0;transform:translateY(22px);filter:blur(6px);transition:opacity .9s ease var(--d,0s),transform 1s cubic-bezier(.2,.7,.2,1) var(--d,0s),filter .9s ease var(--d,0s)}
.rv.in{opacity:1;transform:none;filter:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 언어 버튼: 첫 화면 맨 위 줄 오른쪽, 결과 화면 고정 막대 오른쪽 */
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.hrow .kicker{margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.kicker{display:inline-flex;align-items:center;gap:7px;text-decoration:none;padding:4px 13px 4px 10px;transition:background .15s}
a.kicker:hover,a.kicker:focus-visible{background:rgba(224,189,99,.12)}
a.kicker #kicker{min-width:0;overflow:hidden;text-overflow:ellipsis}
.kmini{width:14px;height:14px;flex:none}
.kcnav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 16px}
.kcnav a{font-size:13px;color:var(--ink2);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;transition:border-color .15s,color .15s}
.kcnav a:hover,.kcnav a:focus-visible{color:var(--gold);border-color:var(--gold2)}
.lang{position:relative;flex:none}
.lang-btn{position:relative;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px 0 9px;border-radius:999px;border:1px solid var(--line);background:rgba(27,34,64,.85);color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.6px;cursor:pointer;transition:border-color .2s,background .2s}
.lang-btn::after{content:'';position:absolute;inset:-6px -2px}
.lang-btn:hover,.lang-btn[aria-expanded="true"]{border-color:var(--gold2);background:#232c52}
.lang-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lang-btn .gl{width:16px;height:16px;color:var(--gold)}
.lang-btn .cv{width:12px;height:12px;color:var(--ink3);transition:transform .2s}
.lang-btn[aria-expanded="true"] .cv{transform:rotate(180deg)}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:70;min-width:188px;margin:0;padding:6px;list-style:none;text-align:left;background:#1b2240;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 32px rgba(0,0,0,.5);animation:rise .18s ease both}
.lang-menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.lang-menu button small{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--ink3)}
.lang-menu button:hover,.lang-menu button:focus-visible{background:#2b3460;outline:none}
.lang-menu button[aria-checked="true"]{color:var(--gold);font-weight:700}
.lang-menu button[aria-checked="true"] small{color:var(--gold)}
.lang-menu button[aria-checked="true"] small::before{content:'✓ '}
.top .lslot{flex:none}
.top .lang-btn{height:30px}
/* 좁은 폰: 위 막대의 언어 버튼은 지구 모양만 남겨 제목 자리를 넓힌다 (메뉴는 그대로 열림) */
@media (max-width:420px){.top .lang-btn{width:36px;height:36px;padding:0;justify-content:center}.top .lang-btn #langCode,.top .lang-btn .cv{display:none}.top .lang-btn .gl{width:19px;height:19px}.top .in{gap:10px}.klogo{width:28px;height:28px}.home{gap:9px}.brand{font-size:18px;letter-spacing:0}html:not([lang="ko"]) .brand{font-size:15.5px}}
.brand{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.callow{display:flex;align-items:center;min-height:26px}
.callow[hidden]{display:none}
/* 한국어보다 긴 언어: 큰 제목을 줄이고, 줄바꿈은 브라우저가 고르게 나눈다 */
.hero h1,.hero .sub,.ih .tt{text-wrap:balance}
html:not([lang="ko"]) .hero h1{font-size:27px;line-height:1.28}
html:not([lang="ko"]) .hero h1 br,html:not([lang="ko"]) .hero .sub br{display:none}
html:not([lang="ko"]) .hero .sub{font-size:14.5px;line-height:1.6;margin-top:8px}
html:not([lang="ko"]) .kicker{letter-spacing:1px}

/* ───────── v4: 밝은 바탕 · 큰 글자 · 강조색 하나(이름에 넣을 기운 색) ───────── */
:root{
  --bg:#f6f4ef; --bg2:#ffffff; --panel:#ffffff; --line:#e4e0d6;
  --ink:#141310; --ink2:#4d4a43; --ink3:#8a867c;
  --gold:#141310; --gold2:#d9d4c7; --cream:#141310; --brown:#141310;
  --e0:#2f7d5b; --e1:#c8402f; --e2:#a77a1e; --e3:#6f7c88; --e4:#1f4e79;
}
html,body{background:var(--bg)}
body{background:var(--bg)}
.hero h1,.tt{background:none;-webkit-text-fill-color:currentColor;color:var(--ink);animation:none}
.hero .sub,.story,.lead,.blk p{color:var(--ink2)}
.lamp,.story b,.blk p b{color:var(--ink)}
.kicker{color:var(--ink2);border-color:var(--line)}
a.kicker:hover,a.kicker:focus-visible{background:#efece4}
.no{background:var(--ink);color:#fff}
.btn{background:var(--ink);color:#fff;border-radius:999px;letter-spacing:.02em}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
input,select{background:#fff;color:var(--ink);border-color:var(--line)}
input:focus,select:focus,.seg button:focus-visible{outline-color:var(--ink)}
.seg button{background:#fff;color:var(--ink2);border-color:var(--line)}
.seg button[aria-pressed="true"],.seg.mini button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg.mini{background:#fff;border-color:var(--line)}
.seg.mini button{color:var(--ink2)}
form label.l,form span.l{color:var(--ink)}
.opt{color:var(--ink3);border-color:var(--line)}
.cta,.stat,.steps3 div,.basis div,.fs,.use,.acc,.dchip,details,.panel{background:#fff;border-color:var(--line)}
.stat .big,.basis b,.fs .cap b{color:var(--ink)}
.fs .n{background:var(--ink);color:#fff}
.fs .lab,.ih small,.acch{color:var(--ink3)}
.use .ic{color:var(--ink);background:#f0ede5;border-color:var(--line)}
.acc .t,.tagc{background:#efece4;color:var(--ink2)}
.acc .r.hl .t{background:var(--ink);color:#fff}
.acc .r.hl b,.exl span{color:var(--ink)}
.exl span{border-color:var(--line)}
.horbs span,.orb,.icb{background:#fff;box-shadow:none}
.horbs span:nth-child(1){color:#2f7d5b!important;border-color:#2f7d5b!important}.horbs span:nth-child(2){color:#c8402f!important;border-color:#c8402f!important}.horbs span:nth-child(3){color:#a77a1e!important;border-color:#a77a1e!important}.horbs span:nth-child(4){color:#6f7c88!important;border-color:#6f7c88!important}.horbs span:nth-child(5){color:#1f4e79!important;border-color:#1f4e79!important}
.farr{color:var(--ink3)}
.top{background:rgba(246,244,239,.92);border-bottom-color:var(--line)}
.brand{background:none;-webkit-text-fill-color:currentColor;color:var(--ink);filter:none}
.home:hover .brand{filter:none}
.klogo{filter:none}
.lang-btn{background:#fff;border-color:var(--line);color:var(--ink)}
.lang-btn:hover,.lang-btn[aria-expanded="true"]{background:#f0ede5;border-color:var(--ink3)}
.lang-btn .gl{color:var(--ink)}
.lang-menu{background:#fff;border-color:var(--line);box-shadow:0 16px 32px rgba(0,0,0,.12)}
.lang-menu button{color:var(--ink)}
.lang-menu button:hover,.lang-menu button:focus-visible{background:#f0ede5}
.lang-menu button[aria-checked="true"],.lang-menu button[aria-checked="true"] small{color:var(--ink)}

.sb{background:#ece8de}.sb .a{background:var(--acc,#2f7d5b)}

/* 결과: 장면마다 한 가지 */
#result{--acc:#141310}
.v4s{position:relative;padding:64px 2px 4px;text-align:center}
.v4k{font-size:12px;letter-spacing:.32em;color:var(--ink3);font-weight:700;margin:0 0 20px}
html:not([lang="ko"]) .v4k{letter-spacing:.18em;text-transform:uppercase}
.v4hero{padding-top:24px}
.v4hero::before{content:'';position:absolute;left:50%;top:-30px;width:520px;max-width:120vw;height:440px;transform:translateX(-50%);background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 20%,transparent),transparent);z-index:-1;pointer-events:none}
.v4hero.in::before{animation:wash 2.2s ease both}
@keyframes wash{from{opacity:0;transform:translateX(-50%) scale(.5)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.v4card{display:grid;place-items:center}
.v4card svg{width:min(52vw,210px);filter:drop-shadow(0 26px 34px rgba(20,19,16,.22))}
.v4hero.in .v4card svg{animation:pop .9s cubic-bezier(.2,.8,.2,1.2) both}
.v4name{font-family:'Noto Serif KR',serif;font-size:clamp(44px,13vw,64px);font-weight:900;letter-spacing:-.02em;line-height:1.1;margin:22px 0 0;color:var(--ink)}
.v4name span{font-size:.42em;font-weight:500;color:var(--c);margin-left:.35em;letter-spacing:.06em;vertical-align:.4em}
.v4mean{font-size:18px;font-weight:800;color:var(--c);margin:8px 0 0}
.v4body{font-size:16.5px;line-height:1.9;color:var(--ink2);text-align:left;margin:16px 0 0;word-break:keep-all}
.v4body.v4c{text-align:center;max-width:30em;margin-left:auto;margin-right:auto}
.v4body b[class^="e"]{font-weight:800}
.v4orbs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 0 8px;padding:22px 0 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.v4o{position:relative;display:grid;justify-items:center;gap:3px;color:var(--c)}
.v4oi .ei{width:22px;height:22px}
.v4on{font-family:'Noto Serif KR',serif;font-size:46px;font-weight:900;line-height:1.05;color:var(--c);font-variant-numeric:tabular-nums}
.v4ow{font-size:13px;font-weight:700;color:var(--ink2)}
.v4o.zero{opacity:.38}
.v4o.many .v4ow::after{content:'';display:block;width:24px;height:3px;border-radius:2px;background:var(--c);margin:5px auto 0}
.v4ot{position:absolute;top:-16px;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--ink);border-radius:999px;padding:0 8px;line-height:1.7}
.v4o{opacity:0;transform:translateY(14px)}
.in .v4o{animation:letter .7s cubic-bezier(.2,.8,.2,1) both}
.in .v4o:nth-child(2){animation-delay:.08s}.in .v4o:nth-child(3){animation-delay:.16s}.in .v4o:nth-child(4){animation-delay:.24s}.in .v4o:nth-child(5){animation-delay:.32s}
.v4big{display:flex;align-items:center;justify-content:center;gap:16px;margin:0 0 4px}
.v4bi{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.v4bi .ei{width:40px;height:40px}
.v4bw{font-family:'Noto Serif KR',serif;font-size:clamp(60px,18vw,92px);font-weight:900;color:var(--c);letter-spacing:-.03em;line-height:1}
.v4need.in .v4bw{animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
.v4need.in .v4bi{animation:pop .8s cubic-bezier(.2,.8,.2,1.3) .2s both}
@keyframes grow{from{opacity:0;letter-spacing:.35em;filter:blur(8px)}to{opacity:1;letter-spacing:-.03em;filter:none}}
@keyframes letter{to{opacity:1;transform:none}}
.v4h{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:900;margin:0 0 16px;color:var(--ink)}
.v4life .dolist{text-align:left}
.v4life .tiny{margin-top:14px}
.v4more{margin:48px 0 8px;border-radius:16px;padding:14px 16px;text-align:left}
.v4more summary{color:var(--ink2)}
.v4more h3{font-size:15px;margin:22px 0 6px;color:var(--ink)}
.v4more .pillars{margin-top:8px}

/* 이름 카드 */
.names{gap:28px;margin-top:24px}
.namecard{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 60px -36px rgba(20,19,16,.35);padding:24px 20px 18px;animation:none}
.namecard.sel{outline:2px solid var(--acc);outline-offset:4px}
.nctop{display:flex;justify-content:space-between;align-items:center}
.namecard .rank,.namecard .kind{position:static}
.namecard .rank{font-size:12px;letter-spacing:.22em;color:var(--ink3);font-weight:800}
.namecard .kind{background:none;color:var(--ink3);border:1px solid var(--line);font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 10px}
.namecard .kind.w{background:none;color:var(--acc);border-color:var(--acc)}
.namecard .ko{font-family:'Noto Serif KR',serif;font-size:clamp(50px,15vw,70px);font-weight:900;letter-spacing:.06em;line-height:1.15;margin-top:16px;color:var(--ink)}
.namecard .ko span{display:inline-block;opacity:0;transform:translateY(20px)}
.namecard.in .ko span{animation:letter .8s cubic-bezier(.2,.8,.2,1) calc(.15s + var(--j) * .13s) both}
.namecard .ro{color:var(--ink3);font-weight:600;font-size:15px}
.glyphs{gap:12px;margin-top:16px}
.glyph{background:#f6f4ef;border:0;border-radius:16px;padding:10px 14px}
.glyph.c0{background:#e6f2ea}.glyph.c1{background:#f8e3dc}.glyph.c2{background:#f5ecd3}.glyph.c3{background:#eceef0}.glyph.c4{background:#e1eaf4}
.glyph .g{color:var(--ink);font-size:38px}
.glyph .gm,.glyph .gm i{color:var(--ink2)}
.namecard.in .glyph .g{animation:inkin 1.2s cubic-bezier(.4,0,.2,1) .55s both}
@keyframes inkin{from{clip-path:inset(0 0 100% 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
.namecard .why{background:none;padding:0;color:var(--ink2);font-size:15.5px;line-height:1.8;margin-top:18px}
.v4meter{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0 0;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--c) 8%,#fff)}
.v4meter .mw{font-weight:800;color:var(--c);font-size:14px}
.v4meter .md{display:flex;gap:6px}
.v4meter i{width:14px;height:14px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 40%,#fff)}
.v4meter i.f{background:color-mix(in srgb,var(--c) 40%,#fff);border-color:transparent}
.v4meter i.a{background:var(--c);border-color:var(--c);transform:scale(0)}
.namecard.in .v4meter i.a{animation:dot .55s cubic-bezier(.3,1.7,.5,1) calc(1.2s + var(--j) * .2s) both}
@keyframes dot{to{transform:scale(1)}}
.v4meter .mn{font-size:14px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.v4meter .mn b{color:var(--c);font-size:18px}
.gainp{font-size:15px;font-weight:600;color:var(--ink);margin:12px 0 0;text-align:left;line-height:1.75}
.gainp b[class^="e"]{font-weight:800}
.ncmore{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 0 0;margin:18px 0 0;text-align:left}
.ncmore summary{font-size:13px;color:var(--ink3);font-weight:700;cursor:pointer}
.chips button{background:#f6f4ef;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.chips button small{color:var(--ink3)}
.chips button::after{background:var(--ink)}
.chips button[aria-expanded="true"]{border-color:var(--ink);box-shadow:none}
.chips .c0{background:#e6f2ea}.chips .c1{background:#f8e3dc}.chips .c2{background:#f5ecd3}.chips .c3{background:#eceef0}.chips .c4{background:#e1eaf4}
.chipnote{background:#f6f4ef;border-left-color:var(--acc)}
.namecard .act button{border:1px solid var(--line);background:#fff;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.v4o,.namecard .ko span{opacity:1;transform:none}.v4meter i.a{transform:none}}

/* 첫 장면: 한 폭의 그림 */
.v4hero{padding-top:0}
.v4scene{position:relative;margin:0 -16px;aspect-ratio:400/520;max-height:80vh;overflow:hidden;border-radius:0 0 30px 30px;background:#e9e3d6}
@media (min-width:560px){.v4scene{margin:12px 0 0;border-radius:30px}}
.v4scene::after{content:'';position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(rgba(246,244,239,0),var(--bg));pointer-events:none}
.v4scene .scene{display:block;width:100%;height:100%;will-change:transform}
.v4hero.in .v4scene{animation:paintin 2.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes paintin{from{opacity:0;transform:scale(1.14);filter:blur(18px) saturate(.15)}to{opacity:1;transform:none;filter:none}}
.v4hero .v4k{position:relative;margin:-6px 0 14px}
.scene .sway{animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
.scene .swing{animation:swing 5.5s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
.scene .glow{transform-box:fill-box;transform-origin:center;animation:sglow 5s ease-in-out infinite}
@keyframes sglow{0%,100%{opacity:.72;transform:scale(.95)}50%{opacity:1;transform:scale(1.06)}}
.scene .flicker{animation:flicker 2.3s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:.85}30%{opacity:1}55%{opacity:.68}80%{opacity:.95}}
.scene .rays{animation:spin 90s linear infinite}.scene .rays.slow{animation-duration:150s}
@keyframes spin{to{transform:rotate(360deg)}}
.scene .fall{transform-box:fill-box;transform-origin:center;animation:fall linear infinite}
@keyframes fall{from{transform:translate(0,-60px) rotate(0)}to{transform:translate(-80px,580px) rotate(400deg)}}
.scene .rise{animation:srise linear infinite}
@keyframes srise{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(24px,-320px);opacity:0}}
.scene .twinkle{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.scene .spark{transform-box:fill-box;transform-origin:center;animation:spark 3s ease-in-out infinite}
@keyframes spark{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.scene .drift{animation:drift 30s ease-in-out infinite alternate}.scene .drift.slow{animation-duration:46s}
@keyframes drift{from{transform:translateX(-50px)}to{transform:translateX(50px)}}
.scene .wave{animation:swave 7s ease-in-out infinite}
@keyframes swave{0%,100%{transform:translateX(0)}50%{transform:translateX(-40px)}}
.scene .bloom{animation:bloom 4s ease-in-out infinite}
@keyframes bloom{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.scene .float{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(-7px)}50%{transform:translateY(7px)}}
.scene .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 3.6s ease-out infinite}
@keyframes ripple{from{transform:scale(.2);opacity:.9}to{transform:scale(2.3);opacity:0}}
.scene .rain{animation:rain linear infinite}
@keyframes rain{from{transform:translate(0,-80px)}to{transform:translate(-22px,540px)}}
.v4cue{display:inline-flex;flex-direction:column;align-items:center;gap:6px;margin:30px 0 0;font-size:12.5px;font-weight:700;letter-spacing:.22em;color:var(--ink3);text-decoration:none}
.v4cue svg{width:22px;height:22px;animation:bob 1.8s ease-in-out infinite}

/* 다섯 기운: 여덟 글자가 기운별 기둥에 떨어져 쌓인다 */
.v4five{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;align-items:end;margin:28px 0 8px;padding:0 0 16px;border-bottom:1px solid var(--line)}
.v4col{display:grid;justify-items:center;gap:8px}
.v4stack{display:flex;flex-direction:column-reverse;align-items:center;gap:7px;min-height:150px}
.seal{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-family:'Noto Serif KR',serif;font-weight:700;font-size:21px;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.16),0 10px 18px -10px var(--c)}
.seal.me{outline:2.5px solid var(--ink);outline-offset:2.5px}
.seal.me::after{content:attr(data-me);position:absolute;top:-10px;right:-14px;font-family:'Noto Sans KR',sans-serif;font-size:10.5px;font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:0 6px;line-height:1.65}
.seal.empty{background:transparent;border:1.5px dashed var(--c);box-shadow:none}
.v4cn{font-family:'Noto Serif KR',serif;font-size:32px;font-weight:900;color:var(--c);line-height:1}
.v4col.zero .v4cn{opacity:.4}
.v4cw{font-size:13px;font-weight:700;color:var(--ink2)}
.v4col.many .v4cw::after{content:'';display:block;width:22px;height:3px;border-radius:2px;background:var(--c);margin:5px auto 0}
.seal{opacity:0;transform:translateY(-170px)}
.in .seal{animation:drop .9s cubic-bezier(.3,1.35,.5,1) calc(.25s + var(--i) * .16s) both}
.in .seal.empty{animation:fadein .7s ease 1.5s both}
@keyframes drop{0%{opacity:0;transform:translateY(-170px)}55%{opacity:1}100%{opacity:1;transform:none}}
@keyframes fadein{to{opacity:.65;transform:none}}
@media (max-width:360px){.seal{width:38px;height:38px;font-size:18px}}
@media (prefers-reduced-motion:reduce){.seal{opacity:1;transform:none}}

/* ───────── v4.1 시인성: 미술관 벽 같은 먹색 바탕 + 크고 굵은 상아색 글자 + 칸 구획 ───────── */
:root{
  --bg:#151413; --bg2:#1f1d1b; --panel:#1f1d1b; --line:#3a3631;
  --ink:#f5f0e6; --ink2:#e2dbcd; --ink3:#b3aa9b;
  --gold:#f5f0e6; --gold2:#4a453e; --cream:#f5f0e6; --brown:#151413;
  --e0:#5fd39b; --e1:#ff8a5c; --e2:#f0c35a; --e3:#dfe6ee; --e4:#6cb4f5;
}
html,body{background:var(--bg)}
.top{background:rgba(21,20,19,.94);border-bottom-color:var(--line)}
.btn{background:var(--ink);color:#151413}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
input,select,.seg button,.seg.mini,.lang-btn,.lang-menu{background:var(--bg2);color:var(--ink);border-color:var(--line)}
.seg button[aria-pressed="true"],.seg.mini button[aria-pressed="true"]{background:var(--ink);color:#151413;border-color:var(--ink)}
.lang-btn:hover,.lang-btn[aria-expanded="true"],.lang-menu button:hover,.lang-menu button:focus-visible,a.kicker:hover{background:#2a2724}
.cta,.stat,.steps3 div,.basis div,.fs,.use,.acc,.dchip,details,.panel{background:var(--panel);border-color:var(--line)}
.fs .n,.no,.metag,.tile .tag,.acc .r.hl .t,.v4ot{background:var(--ink);color:#151413}
.use .ic,.acc .t,.tagc{background:#2a2724;color:var(--ink2);border-color:var(--line)}
.horbs span,.orb,.icb{background:var(--bg2)}
.tile{background:#26231f}.tile.me{border-color:var(--ink)}
.sb{background:#2a2724}
.yy .y{background:#efe6cf;color:#151413}.yy .n{background:#0c0b0a;color:#eee;border:1px solid var(--line)}
.pairs div{background:#26231f;color:var(--ink3)}.pairs b{color:var(--ink)}
.sbtn.save{background:var(--bg2);color:var(--ink);border-color:var(--line)}.sbtn.send{background:var(--ink);color:#151413}
#loading{background:rgba(21,20,19,.97)}
.hero h1,.tt,.brand{color:var(--ink)}
/* 결과 글자: 크고 굵게, 흐린 회색을 쓰지 않는다 */
.v4s{padding:44px 0 6px}
.v4k{font-size:15px;letter-spacing:.06em;font-weight:800;color:var(--ink);margin:0 0 14px}
.v4k::before{content:'';display:block;width:28px;height:3px;border-radius:2px;background:var(--acc,var(--ink));margin:0 auto 12px}
html:not([lang="ko"]) .v4k{letter-spacing:.06em;text-transform:none}
.v4body{font-size:17px;line-height:1.85;color:var(--ink2);font-weight:500}
.v4body b[class^="e"]{font-weight:900}
.v4name{color:var(--ink);font-size:clamp(46px,13vw,62px);margin-top:18px}
.v4mean{font-size:19px}
/* 칸 구획: 장면마다 한 장의 판 */
.v4s:not(.v4hero){margin-top:22px;padding:28px 18px 24px;border-radius:22px;background:var(--panel);border:1px solid var(--line)}
.v4names{background:transparent!important;border:0!important;padding:28px 2px 0!important}
/* 첫 장면 그림: 화면 폭의 4분의 3, 액자처럼 */
.v4hero{padding-top:18px}
.v4scene{margin:8px auto 0;width:min(74vw,320px);aspect-ratio:4/5;max-height:none;border-radius:20px;background:#0f0e0d;box-shadow:0 0 0 1px #2e2a25,0 30px 60px -30px rgba(0,0,0,.9)}
.v4scene::after{display:none}
.v4hero.in .v4scene{animation:none}
.v4scene .scene{width:100%;height:100%}
.v4hero .v4k{margin:26px 0 0}
.v4cue{color:var(--ink2);font-size:14px;letter-spacing:.04em}
/* 다섯 기운: 한 줄에 하나 */
.v4rows{display:grid;gap:12px;margin:22px 0 18px;text-align:left}
.v4row{display:grid;grid-template-columns:44px 1fr 30px 40px;align-items:center;gap:10px;font-size:17px}
.v4row .rw{font-weight:800;color:var(--c)}
.v4row .rd{display:flex;gap:6px;flex-wrap:nowrap}
.v4row .rd i{width:16px;height:16px;border-radius:50%;border:1.5px solid #4a453e;flex:none}
.v4row .rd i.on{background:var(--c);border-color:var(--c);transform:scale(0)}
.in .v4row .rd i.on{animation:dot .5s cubic-bezier(.3,1.6,.5,1) calc(.2s + var(--j) * .09s) both}
.v4row .rn{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:900;color:var(--c);text-align:right}
.v4row .rt{font-size:12.5px;font-weight:800;color:var(--ink3)}
.v4row.zero .rw,.v4row.zero .rn{opacity:.55}
.v4row.many .rt{color:var(--c)}
@media (max-width:360px){.v4row .rd i{width:12px;height:12px}.v4row{grid-template-columns:40px 1fr 26px 34px;gap:8px}}
@media (prefers-reduced-motion:reduce){.v4row .rd i.on{transform:none}}
/* 넣을 기운 */
.v4bi{background:color-mix(in srgb,var(--c) 18%,#151413)}
/* 이름 카드 */
.namecard{background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:0 30px 60px -36px rgba(0,0,0,.9)}
.namecard .ko{color:var(--ink)}
.namecard .ro,.namecard .rank{color:var(--ink2)}
.namecard .kind{color:var(--ink2);border-color:var(--line)}
.glyph{background:#26231f}
.glyph.c0{background:#1d3328}.glyph.c1{background:#3a2219}.glyph.c2{background:#3a301a}.glyph.c3{background:#2b2f34}.glyph.c4{background:#1b2a3b}
.glyph .g{color:var(--ink)}.glyph .gm,.glyph .gm i{color:var(--ink2)}
.namecard .why{color:var(--ink2);font-size:16.5px;font-weight:500}
.v4meter{background:color-mix(in srgb,var(--c) 14%,#151413)}
.v4meter i{border-color:color-mix(in srgb,var(--c) 45%,#151413)}
.v4meter i.f{background:color-mix(in srgb,var(--c) 45%,#151413)}
.v4meter .mn{color:var(--ink2)}
.gainp{color:var(--ink);font-size:16px}
.ncmore{border-top-color:var(--line)}.ncmore summary{color:var(--ink2)}
.chips button{background:#26231f;color:var(--ink);border-color:var(--line)}

.seg button[aria-pressed="true"],.seg.mini button[aria-pressed="true"],.sbtn.send{background:#e9c264;color:#1b1406;border-color:#e9c264;font-weight:600}

#go,#goTop{color:#1b1406;
  background:linear-gradient(115deg,#b9862e 0%,#e9c264 18%,#fff1c2 32%,#e9c264 46%,#c8973c 60%,#f6d98a 76%,#fff6d8 86%,#d9ab4a 100%) 0 0/300% 100%;
  box-shadow:0 10px 26px -12px rgba(233,194,100,.75),inset 0 0 0 1px rgba(255,240,200,.35);
  animation:goldflow 4.5s linear infinite,aura3 3s ease-in-out infinite}
@keyframes goldflow{from{background-position:0% 0}to{background-position:-300% 0}}

<script>/* engine.js */
// 국제커플 궁합 계산 엔진 (검증용. 배포 전, 승인 후 화면에 붙인다)
// 생년월일시는 이 파일 안에서만 계산한다. 저장·전송 코드 없음.
'use strict';

const DR = Math.PI / 180;
const floor = Math.floor;
const mod = (a, n) => ((a % n) + n) % n;

/* ───────────── 1. 날짜·시각 ───────────── */

// 그레고리력 날짜 → 율리우스 일수(정수, 그날 정오)
function jdn(y, m, d) {
  const a = floor((14 - m) / 12);
  const yy = y + 4800 - a;
  const mm = m + 12 * a - 3;
  return d + floor((153 * mm + 2) / 5) + 365 * yy + floor(yy / 4) - floor(yy / 100) + floor(yy / 400) - 32045;
}
function jdnToDate(j) {
  const a = j + 32044;
  const b = floor((4 * a + 3) / 146097);
  const c = a - floor((146097 * b) / 4);
  const d = floor((4 * c + 3) / 1461);
  const e = c - floor((1461 * d) / 4);
  const m = floor((5 * e + 2) / 153);
  return { y: b * 100 + d - 4800 + floor(m / 10), m: m + 3 - 12 * floor(m / 10), d: e - floor((153 * m + 2) / 5) + 1 };
}
const jdFromMs = (ms) => ms / 86400000 + 2440587.5;
const msFromJd = (jd) => (jd - 2440587.5) * 86400000;

// IANA 시간대 DB로 그 순간의 UTC 차이(분). 한국 1908 +8:30, 1912 +9, 1954 +8:30, 1961 +9, 서머타임 포함
const fmtCache = {};
function tzOffsetMin(ms, tz) {
  if (!fmtCache[tz]) {
    fmtCache[tz] = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
    });
  }
  const s = floor(ms / 1000) * 1000; // 초 단위로 맞춰 소수점 오차 제거
  const o = {};
  for (const p of fmtCache[tz].formatToParts(new Date(s))) o[p.type] = p.value;
  return (Date.UTC(+o.year, +o.month - 1, +o.day, +o.hour, +o.minute, +o.second) - s) / 60000;
}
// 그 지역 벽시계 시각 → UTC ms
function localToUtcMs(y, m, d, h, mi, tz) {
  const wall = Date.UTC(y, m - 1, d, h, mi);
  let guess = wall - tzOffsetMin(wall, tz) * 60000;
  for (let i = 0; i < 3; i++) guess = wall - tzOffsetMin(guess, tz) * 60000;
  return guess;
}

// ΔT = TT − UT (초).
// 1972년부터: 32.184 + 윤초 누적(TAI−UTC, IERS Bulletin C). UT1−UTC는 늘 ±0.9초 안이라 오차 1초 미만
// 1972년 전: Espenak·Meeus 다항식
const LEAP = [[1972, 10], [1972.5, 11], [1973, 12], [1974, 13], [1975, 14], [1976, 15], [1977, 16], [1978, 17], [1979, 18], [1980, 19],
  [1981.5, 20], [1982.5, 21], [1983.5, 22], [1985.5, 23], [1988, 24], [1990, 25], [1991, 26], [1992.5, 27], [1993.5, 28], [1994.5, 29],
  [1996, 30], [1997.5, 31], [1999, 32], [2006, 33], [2009, 34], [2012.5, 35], [2015.5, 36], [2017, 37]];
function deltaT(year) {
  const y = year;
  if (y >= 1972) {
    let n = 10;
    for (const [t, v] of LEAP) if (y >= t) n = v;
    return 32.184 + n;
  }
  let t;
  if (y < 1900) { t = y - 1860; return 7.62 + 0.5737 * t - 0.251754 * t * t + 0.01680668 * t ** 3 - 0.0004473624 * t ** 4 + t ** 5 / 233174; }
  if (y < 1920) { t = y - 1900; return -2.79 + 1.494119 * t - 0.0598939 * t * t + 0.0061966 * t ** 3 - 0.000197 * t ** 4; }
  if (y < 1941) { t = y - 1920; return 21.2 + 0.84493 * t - 0.0761 * t * t + 0.0020936 * t ** 3; }
  if (y < 1961) { t = y - 1950; return 29.07 + 0.407 * t - (t * t) / 233 + t ** 3 / 2547; }
  if (y < 1986) { t = y - 1975; return 45.45 + 1.067 * t - (t * t) / 260 - t ** 3 / 718; }
  if (y < 2005) { t = y - 2000; return 63.86 + 0.3345 * t - 0.060374 * t * t + 0.0017275 * t ** 3 + 0.000651814 * t ** 4 + 0.00002373599 * t ** 5; }
  if (y < 2050) { t = y - 2000; return 62.92 + 0.32217 * t + 0.005589 * t * t; }
  if (y < 2150) { return -20 + 32 * ((y - 1820) / 100) ** 2 - 0.5628 * (2150 - y); }
  const u = (y - 1820) / 100; return -20 + 32 * u * u;

    const M = 357.52911 + jc * (35999.05029 - 0.0001537 * jc);

}

<script>/* naming_engine.js */
// 사주 풀이 + 한국 이름 작명 계산 (궁합계산/engine.js 위에 얹는다)
// 단계와 규칙은 한국작명원 성명학 이론(irum.com/Resource/Theory) 순서를 따른다. 근거는 기획안 참고
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) module.exports = factory;
  else root.Jakmyeong = factory; // Node와 같게: Jakmyeong(Gunghap) 으로 부른다
})(typeof self !== 'undefined' ? self : this, function (G) {
  'use strict';
  const mod = (a, n) => ((a % n) + n) % n;
  const EL_K = ['목', '화', '토', '금', '수'];

  /* 1. 음양: 천간·지지 순서가 짝수면 양, 홀수면 음 (甲子 양, 乙丑 음) */
  function yinYang(s) {
    const list = [];
    for (const k of ['year', 'month', 'day', 'hour']) {
      const p = s.pillars[k];
      if (!p) continue;
      list.push({ pos: k, part: 'stem', yang: p.stem % 2 === 0 });
      list.push({ pos: k, part: 'br', yang: p.br % 2 === 0 });
    }
    const yang = list.filter((x) => x.yang).length;
    const yin = list.length - yang;
    const label = yin === 0 ? '양팔통' : yang === 0 ? '음팔통' : null;
    return { yang, yin, total: list.length, label, list };
  }

  /* 2. 오행 균형: encykorea '사주' 태과(3개 이상)·불급(0개) */
  function balance(s) {
    const c = s.elements;
    return { counts: c, excess: c.map((n, i) => (n >= 3 ? i : -1)).filter((i) => i >= 0), lack: c.map((n, i) => (n === 0 ? i : -1)).filter((i) => i >= 0) };
  }

  /* 3. 십성 묶음: 일간 오행 기준 */
  function role(dm, el) {
    const d = mod(el - dm, 5);

  }
  const glyphEl = (p, part) => (part === 'stem' ? G.stemEl(p.stem) : G.BR_EL[p.br]);

  /* 4. 강약왕쇠: 작명소 방식 (irum 10118). 일간은 세지 않고 월지는 2개로 센다 */
  function strengthIrum(s) {
    const dm = G.stemEl(s.dayMaster);
    const items = [];
    for (const k of ['year', 'month', 'day', 'hour']) {

      if (!p) continue;
      for (const part of ['stem', 'br']) {
        if (k === 'day' && part === 'stem') continue;
        const el = glyphEl(p, part);
        const r = role(dm, el);
        const help = r === '비겁' || r === '인성';
        const weight = k === 'month' && part === 'br' ? 2 : 1;
        items.push({ pos: k, part, el, role: r, help, weight });
      }
    }
    const help = items.filter((x) => x.help).reduce((a, x) => a + x.weight, 0);
    const drain = items.filter((x) => !x.help).reduce((a, x) => a + x.weight, 0);
    const verdict = help < drain ? '신약' : help > drain ? '신강' : '중화';
    const byRole = { 비겁: 0, 식상: 0, 재성: 0, 관성: 0, 인성: 0 };
    for (const x of items) byRole[x.role] += x.weight;
    return { dm, items, help, drain, verdict, byRole };
  }

  /* 5. 강약 대조: 이재승(2019) 자리별 점수. 비겁·인성이 있는 자리만 더한다 */
  const LEE_W = { year: { stem: 5, br: 9 }, month: { stem: 10, br: 30 }, day: { stem: 0, br: 21 }, hour: { stem: 10, br: 15 } };
  function strengthLee(s) {
    const dm = G.stemEl(s.dayMaster);

        const r = role(dm, glyphEl(p, part));
        if (r === '비겁' || r === '인성') score += LEE_W[k][part];
      }
    }
    const verdict = score <= 45 ? '신약' : score <= 60 ? '중화신약' : score <= 75 ? '중화신강' : '신강';
    return { score, verdict };
  }

  /* 5-1. 최종 강약: 작명소 방식이 기본. 4:4 동수는 작명소가 판정을 공개하지 않아 이재승 점수로 방향만 정한다
     (60 이하 약한 쪽, 61 이상 강한 쪽). 공개 사주 9건 대조에서 이 방식이 6/9, 46~75를 중화로 두는 방식이 5/9였다 */
  function strength(s) {
    const st = strengthIrum(s);
    if (st.verdict !== '중화') return { ...st, method: 'irum', balanced: false };
    const lee = strengthLee(s);
    return { ...st, verdict: lee.score <= 60 ? '신약' : '신강', method: 'lee', balanced: true, tieScore: lee.score, tieLabel: lee.verdict };
  }

  /* 5-2. 조후 표시: 조후는 억부보다 먼저 본다(이재승 2019 초록 "조후용신을 우선"), 작명소도 "추우면 따뜻하게 너무 더우면 서늘하게"(irum 10133).
     어느 사주가 "춥다·덥다"인지 기준은 본문 확인 전이라, 겨울 달(亥子丑월)·여름 달(巳午未월) 출생을 후보로만 표시한다 [검증 전] */
  function johu(s) {
    const mb = s.pillars.month.br;
    const season = [11, 0, 1].includes(mb) ? '겨울' : [5, 6, 7].includes(mb) ? '여름' : null;
    if (!season) return null;
    const need = season === '겨울' ? 1 : 4; // 겨울은 화, 여름은 수
    return { season, need, count: s.elements[need] };
  }

  /* 6. 용신 (시안 규칙)
     - 신약: 돕는 기운(인성·비겁) 중 적은 쪽. 같으면 인성 (irum 10118·10133 예시가 모두 인성)
     - 신강: 힘을 빼는 기운(식상·재성·관성) 중 적은 쪽. 같으면 식상 → 재성 → 관성 순 [검증 전]
     - 중화: 따로 보강하지 않고 상생 흐름만. 0개인 기운이 있으면 참고로 알려 준다
     작명소가 오행을 공개한 사주 9건 중 6건과 같다. 다른 3건은 격국·병약·통관으로 정한 경우다 (selftest 참고) */
  function yongsin(s) {
    const st = strength(s);
    const dm = st.dm;
    const elOf = (r) => mod(dm + { 비겁: 0, 식상: 1, 재성: 2, 관성: 3, 인성: 4 }[r], 5);
    let roles;
    if (st.verdict === '신약') roles = ['인성', '비겁'];
    else if (st.verdict === '신강') roles = ['식상', '재성', '관성'];
    else return { verdict: st.verdict, el: null, role: null, lackRef: balance(s).lack, strength: st, johu: johu(s) };
    let best = roles[0];
    for (const r of roles) if (st.byRole[r] < st.byRole[best]) best = r;
    return { verdict: st.verdict, el: elOf(best), role: best, candidates: roles.map((r) => ({ role: r, el: elOf(r), n: st.byRole[r] })), strength: st, johu: johu(s) };
  }

  /* 7. 81수 길흉표 (irum 10131). 77은 표에 없다 */
  const SURI_GOOD = { 1: '기본격', 3: '성형격', 5: '정성격', 6: '계성격', 7: '독립격', 8: '개물격', 11: '신성격', 13: '지모격', 15: '통솔격', 16: '덕망격', 17: '건창격', 18: '발전격', 21: '두령격', 23: '공명격', 24: '입신격', 25: '안전격', 29: '성공격', 31: '융창격', 32: '요행격', 33: '승천격', 35: '평범격', 37: '인덕격', 38: '복록격', 39: '안락격', 41: '대공격', 45: '대지격', 47: '출세격', 48: '유덕격', 51: '춘추격', 52: '능직격', 57: '노력격', 58: '자력격', 61: '영화격', 63: '길상격', 65: '완미격', 67: '성장격', 68: '달성격', 73: '형통격', 75: '왕성격', 81: '환희격' };
  const SURI_BAD = { 2: '분리격', 4: '부정격', 9: '궁박격', 10: '공허격', 12: '박약격', 14: '이산격', 19: '고난격', 20: '허망격', 22: '중절격', 26: '시비격', 27: '중단격', 28: '파란격', 30: '부몽격', 34: '파멸격', 36: '실패격', 40: '무상격', 42: '고행격', 43: '미혹격', 44: '마장격', 46: '부지격', 49: '은퇴격', 50: '불행격', 53: '불화격', 54: '신고격', 55: '불인격', 56: '부족격', 59: '불우격', 60: '암흑격', 62: '고독격', 64: '침체격', 66: '역난격', 69: '쇠약격', 70: '암난격', 71: '불안격', 72: '상반격', 74: '불교격', 76: '이산격', 78: '무력격', 79: '불신격', 80: '음영격' };
  function suri(n) {
    if (SURI_GOOD[n]) return { n, good: true, name: SURI_GOOD[n] };
    if (SURI_BAD[n]) return { n, good: false, name: SURI_BAD[n] };
    return { n, good: null, name: '표에 없음' };
  }

  /* 8. 원형이정 사격 (irum 10131). surname: 성 획수 배열(복성은 2개), given: 이름 획수 배열(1~2개) */
  function sagyeok(surname, given) {
    const S = surname.reduce((a, b) => a + b, 0);
    let won, hyung, yi, jung;
    if (given.length === 2) { won = given[0] + given[1]; hyung = S + given[0]; yi = S + given[1]; jung = S + given[0] + given[1]; }
    else { won = given[0]; hyung = S + given[0]; yi = S; jung = S + given[0]; }
    const g = { 원격: suri(won), 형격: suri(hyung), 이격: suri(yi), 정격: suri(jung) };
    const allGood = Object.values(g).every((x) => x.good === true);
    return { ...g, allGood };
  }

  /* 9. 획수 음양 배치 (irum 10121): 홀수 양, 짝수 음. 모두 같으면 배치 안 됨 */
  function strokeYinYang(strokes) {
    const yy = strokes.map((n) => (n % 2 === 1 ? '양' : '음'));
    return { yy, ok: new Set(yy).size > 1 };
  }

  /* 10. 성 획수가 주어졌을 때 사격이 모두 길수이고 음양 배치가 되는 이름 획수 조합 */
  function goodStrokePairs(surname, max = 24) {
    const out = [];
    for (let a = 1; a <= max; a++) for (let b = 1; b <= max; b++) {
      const sg = sagyeok(surname, [a, b]);
      if (!sg.allGood) continue;
      if (!strokeYinYang([...surname, a, b]).ok) continue;
      out.push([a, b, sg]);
    }
    return out;
  }

  /* 11. 소리오행: 운해본(작명계 다수설)과 해례본 */
  const CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
  const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
  const BASE = { ㄲ: 'ㄱ', ㄸ: 'ㄷ', ㅃ: 'ㅂ', ㅆ: 'ㅅ', ㅉ: 'ㅈ', ㄳ: 'ㄱ', ㄵ: 'ㄴ', ㄶ: 'ㄴ', ㄺ: 'ㄹ', ㄻ: 'ㄹ', ㄼ: 'ㄹ', ㄽ: 'ㄹ', ㄾ: 'ㄹ', ㄿ: 'ㄹ', ㅀ: 'ㄹ', ㅄ: 'ㅂ' };
  const SOUND = {
    unhae: { ㄱ: 0, ㅋ: 0, ㄴ: 1, ㄷ: 1, ㄹ: 1, ㅌ: 1, ㅇ: 2, ㅎ: 2, ㅅ: 3, ㅈ: 3, ㅊ: 3, ㅁ: 4, ㅂ: 4, ㅍ: 4 },
    haerye: { ㄱ: 0, ㅋ: 0, ㄴ: 1, ㄷ: 1, ㄹ: 1, ㅌ: 1, ㅁ: 2, ㅂ: 2, ㅍ: 2, ㅅ: 3, ㅈ: 3, ㅊ: 3, ㅇ: 4, ㅎ: 4 },
  };
  function decompose(ch) {
    const c = ch.charCodeAt(0) - 0xac00;
    if (c < 0 || c > 11171) return null;
    return { cho: CHO[Math.floor(c / 588)], jong: JONG[c % 28] };
  }
  const soundEl = (jamo, scheme) => (jamo ? SOUND[scheme][BASE[jamo] || jamo] : undefined);
  const sheng = (a, b) => mod(a + 1, 5) === b || mod(b + 1, 5) === a; // 어느 쪽이든 생하면 상생
  function chainOk(els) {
    if (els.some((e) => e === undefined)) return false;
    for (let i = 0; i + 1 < els.length; i++) if (!sheng(els[i], els[i + 1])) return false;
    return true;
  }
  // irum 10126: 성 초성-가운데 초성-끝 초성, 또는 성 받침-가운데 초성-끝 초성, 또는 성 받침-가운데 초성-가운데 받침-끝 초성이 상생하면 좋다
  function soundCheck(fullName, scheme) {
    const parts = [...fullName].map(decompose);
    if (parts.some((p) => !p) || parts.length < 2) return null;
    const el = parts.map((p) => ({ cho: soundEl(p.cho, scheme), jong: p.jong ? soundEl(p.jong, scheme) : null }));
    const [s, m, e] = el.length === 3 ? el : [el[0], el[1], null];
    const routes = [];
    routes.push(e ? [s.cho, m.cho, e.cho] : [s.cho, m.cho]);
    if (s.jong !== null) routes.push(e ? [s.jong, m.cho, e.cho] : [s.jong, m.cho]);
    if (e && s.jong !== null && m.jong !== null) routes.push([s.jong, m.cho, m.jong, e.cho]);
    const ok = routes.some(chainOk);
    // 세 단계로 나눈다: good = 한 길이라도 모두 상생 / flat = 상생은 아니지만 상극 없이 같은 기운(비화)이 이어짐 / clash = 모든 길에 상극
    // 작명소 예시 李昇俊(토·금·금, irum 10130)이 flat 이다. 비화를 흉으로 본다는 출처는 찾지 못해 주의로 표시하지 않는다
    const ke = (a, b) => mod(a + 2, 5) === b || mod(b + 2, 5) === a;
    const noClash = (r) => r.every((x) => x !== undefined) && r.every((x, i) => i === 0 || !ke(r[i - 1], x));
    const level = ok ? 'good' : routes.some(noClash) ? 'flat' : 'clash';
    return { ok, level, els: el, routes };
  }

  /* 11-1. 로마자: 국어의 로마자 표기법(문화체육관광부 고시 제2014-42호) 제3장 제4항. 이름은 붙여 쓰는 것이 원칙이고 음절 사이 붙임표는 허용,
     이름에서 일어나는 음운 변화는 반영하지 않는다. 보기 "한복남 Han Boknam (Han Bok-nam)". 성의 표기는 따로 정한다고 되어 있어 이름만 적는다.
     romanizeGiven(이름) = 원칙 꼴, romanizeGiven(이름, true) = 붙임표 꼴 */
  const RR_CHO = { ㄱ: 'g', ㄲ: 'kk', ㄴ: 'n', ㄷ: 'd', ㄸ: 'tt', ㄹ: 'r', ㅁ: 'm', ㅂ: 'b', ㅃ: 'pp', ㅅ: 's', ㅆ: 'ss', ㅇ: '', ㅈ: 'j', ㅉ: 'jj', ㅊ: 'ch', ㅋ: 'k', ㅌ: 't', ㅍ: 'p', ㅎ: 'h' };
  const RR_JUNG = ['a', 'ae', 'ya', 'yae', 'eo', 'e', 'yeo', 'ye', 'o', 'wa', 'wae', 'oe', 'yo', 'u', 'wo', 'we', 'wi', 'yu', 'eu', 'ui', 'i'];
  const RR_JONG = { '': '', ㄱ: 'k', ㄲ: 'k', ㄳ: 'k', ㄴ: 'n', ㄵ: 'n', ㄶ: 'n', ㄷ: 't', ㄹ: 'l', ㄺ: 'k', ㄻ: 'm', ㄼ: 'l', ㄽ: 'l', ㄾ: 'l', ㄿ: 'p', ㅀ: 'l', ㅁ: 'm', ㅂ: 'p', ㅄ: 'p', ㅅ: 't', ㅆ: 't', ㅇ: 'ng', ㅈ: 't', ㅊ: 't', ㅋ: 'k', ㅌ: 't', ㅍ: 'p', ㅎ: 't' };
  function romanizeGiven(given, hyphen = false) {
    const parts = [...given].map((ch) => {
      const c = ch.charCodeAt(0) - 0xac00;
      if (c < 0 || c > 11171) return ch;
      return RR_CHO[CHO[Math.floor(c / 588)]] + RR_JUNG[Math.floor((c % 588) / 28)] + RR_JONG[JONG[c % 28]];
    });
    const s = parts.join(hyphen ? '-' : '');
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  /* 12. 자원오행·획수: 작명소 문서에 나온 글자만 (irum 10119·10121·10125·10130·10133). 나머지는 사전 확보 뒤 */
  const HANJA = {
    李: { s: 7, el: 0, ko: '이', m: '오얏' }, 昇: { s: 8, el: 1, ko: '승', m: '오를' }, 桓: { s: 10, el: 0, ko: '환', m: '굳셀' },
    奇: { s: 8, el: 2, ko: '기', m: '기이할' }, 東: { s: 8, el: 0, ko: '동', m: '동녘' }, 煥: { s: 13, el: 1, ko: '환', m: '빛날' },
    金: { s: 8, ko: '김', m: '쇠' }, 承: { s: 8, ko: '승', m: '이을' }, 勳: { s: 16, ko: '훈', m: '공' }, 旻: { s: 8, ko: '민', m: '하늘' },
    俊: { s: 9, el: 1, ko: '준', m: '준걸' }, 許: { s: 11, ko: '허', m: '허락할' }, 埈: { s: 10, el: 2, ko: '준', m: '높을' }, 晙: { s: 11, ko: '준', m: '밝을' },
    成: { s: 7, ko: '성', m: '이룰' }, 炫: { s: 9, el: 1, ko: '현', m: '밝을' },
    柱: { el: 0, ko: '주', m: '기둥' }, 秀: { el: 0, ko: '수', m: '빼어날' }, 家: { el: 0, ko: '가', m: '집' }, 甲: { el: 0, ko: '갑', m: '갑옷' }, 康: { el: 0, ko: '강', m: '편안할' }, 綱: { el: 0, ko: '강', m: '벼리' },
    炳: { el: 1, ko: '병', m: '밝을' }, 昞: { el: 1, ko: '병', m: '밝을' }, 晟: { el: 1, ko: '성', m: '밝을' }, 車: { el: 1, ko: '거·차', m: '수레' }, 見: { el: 1, ko: '견', m: '볼' },
    左: { el: 2, ko: '좌', m: '왼' }, 城: { el: 2, ko: '성', m: '성' }, 基: { el: 2, ko: '기', m: '터' }, 達: { el: 2, ko: '달', m: '통달할' }, 邑: { el: 2, ko: '읍', m: '고을' },
    鉉: { el: 3, ko: '현', m: '솥귀' }, 玲: { el: 3, ko: '령', m: '옥소리' }, 劉: { el: 3, ko: '류', m: '죽일' }, 謨: { el: 3, ko: '모', m: '꾀' }, 敏: { el: 3, ko: '민', m: '민첩할' }, 白: { el: 3, ko: '백', m: '흰' },
    泳: { el: 4, ko: '영', m: '헤엄칠' }, 甫: { el: 4, ko: '보', m: '클' }, 月: { el: 4, ko: '월', m: '달' }, 夕: { el: 4, ko: '석', m: '저녁' }, 善: { el: 4, ko: '선', m: '착할' }, 雨: { el: 4, ko: '우', m: '비' },
  };
  // 작명소 문서 예시에 나온 결과지 (irum 10119·10133). 시안의 예시 결과지로 쓴다
  /* 12-1. 분파 (irum 10129): 성과 이름 세 글자가 모두 좌우 두 쪽으로 갈라지면 안 된다. 예 張(弓+長) 仁(人+二) 錫(金+易)
     이름 두 자만 갈라지는 것은 분파가 아니다. 아래는 좌우로 갈라지는 글자 (위 표 글자와 문서 예시 글자만, 손으로 분류) */
  const LR_SPLIT = new Set([...'桓煥勳俊許埈晙炫柱綱炳昞城鉉玲劉謨敏泳張仁錫']);
  function bunpa(chars) {
    const list = [...chars];
    if (list.length < 3) return { split: false, known: true };
    return { split: list.every((c) => LR_SPLIT.has(c)), known: true };
  }

  // 12-2. 성: 획수가 작명소 문서로 확인된 성만 (irum 10119·10121·10133)
  const SURNAMES = [{ h: '金', ko: '김', s: [8] }, { h: '李', ko: '이', s: [7] }, { h: '許', ko: '허', s: [11] }, { h: '奇', ko: '기', s: [8] }];

  /* 12-3. 이름 후보 (미리보기): 획수가 확인된 이름 글자로 만든다. 가운데 글자 자원오행 = 용신, 사격 모두 길수, 획수 음양 섞임, 분파 아님.
     소리오행은 두 학설 통과 여부로 순서만 정한다. 정식 데이터(인명용 한자 사전·대법원 이름 통계)가 들어오면 이 풀만 넓힌다 */
  function previewCandidates(sur, want) {
    const pool = Object.entries(HANJA).filter(([h, v]) => v.s && !SURNAMES.some((x) => x.h === h));
    const out = [];
    for (const [mh, m] of pool) {
      if (want !== null && want !== undefined ? m.el !== want : m.el === undefined) continue;
      for (const [eh, e] of pool) {
        if (eh === mh || e.ko === m.ko) continue;
        const sg = sagyeok(sur.s, [m.s, e.s]);
        if (!sg.allGood || !strokeYinYang([...sur.s, m.s, e.s]).ok) continue;
        if (bunpa(sur.h + mh + eh).split) continue; // 분파 (irum 10129)
        const ko = sur.ko + m.ko + e.ko;

    // 추천 1·2는 한자 이름. 추천 3은 세 번째 한자 이름이 약할 때만 순우리말로 바꾼다 (한자가 더 좋은 사주는 한자 그대로, 대표님 11/22)
    //  약함: 목록 120위 밖(요즘 느낌이 덜함), 두 글자 뜻 묶음이 모두 앞 이름과 겹침, 성이 있는데 네 격이 모두 길하지는 않음
    const fresh = (w, list) => !list.some((c) => c.given === w.given || c.given[0] === w.given[0] || c.given[1] === w.given[1]);
    let chosen = choose3(hj, [], 2);
    const w3 = wr.find((w) => fresh(w, chosen));
    const h3 = choose3(hj, chosen, 1)[0];
    const famOf = (c) => (c && c.type === 'hanja' ? c.parts.map((p) => groupOf(p.h)) : []);
    const usedFam = new Set(chosen.flatMap(famOf));
    const weak3 = !h3 || h3.idx >= 120 || famOf(h3).every((f) => usedFam.has(f)) || (sur && !h3.suri.allGood);
    const third = w3 && weak3 ? w3 : h3 || w3;
    if (third) chosen = [...chosen, third];
    if (chosen.length < 3) { // 한자 이름이 모자라면 순우리말(희신 뜻까지)로 채운다
      for (const w of wooriCandidates(t, gender, sur, true)) { if (chosen.length >= 3) break; if (fresh(w, chosen)) chosen.push(w); }
    }
    if (chosen.length < 3) {
      level = 3;
      chosen = [...chosen, ...choose3(hanjaCandidates(t, gender, sur, 3), chosen, 3 - chosen.length)];
    }
    if (chosen.length < 3) { // 그래도 모자라면 거른 글자까지 풀어 세 개를 채운다
      chosen = [...chosen, ...choose3(hanjaCandidates(t, gender, sur, 4), chosen, 3 - chosen.length)];
    }
    if (chosen.length < 3) { // 성과 획수가 까다로운 드문 경우: 정격(총운)만 길수로 지키고 채운다
      level = 5;
      chosen = [...chosen, ...choose3(hanjaCandidates(t, gender, sur, 5), chosen, 3 - chosen.length)];
    }
    chosen = chosen.map(({ alts, ...c }) => c);
    return { names: chosen.slice(0, 3).map((c) => ({ ...c, roman: J.romanizeGiven(c.given), romanH: J.romanizeGiven(c.given, true) })), level, pool: hj.length, woori: wr.length };
  }
  function run(s, gender, sur) {
    const t = target(s);
    const r = pick(t, gender, sur);
    return { target: t, ...r };
  }

  return { target, sound, hanjaCandidates, wooriCandidates, pick, run };
});

function ring(words) {
  const R = 92, pt = (k, r = R) => { const a = (-90 + k * 72) * Math.PI / 180; return [Math.cos(a) * r, Math.sin(a) * r]; };
  const arcs = [0, 1, 2, 3, 4].map((k) => {
    const [x1, y1] = pt(k + .2), [x2, y2] = pt(k + .8);

    const [x, y] = pt(k);
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="27" fill="#1b2240" stroke="${EC[k]}" stroke-width="2.5"/><g transform="translate(-11 -17) scale(.92)" color="${EC[k]}">${ICON_PATH[k].replace(/<path /g, '<path fill="currentColor" fill-opacity=".22" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" ')}</g><text y="19" text-anchor="middle" font-family="Noto Sans KR,sans-serif" font-size="11" font-weight="700" fill="${EC[k]}">${words[k]}</text></g>`;

  return `<svg viewBox="-130 -130 260 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="다섯 기운의 상생과 상극"><defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#e0bd63"/></marker></defs>
  ${starL}${arcs}
  <circle r="5" fill="#fff3c4"><animateMotion dur="10s" repeatCount="indefinite" path="M0 -${R} A${R} ${R} 0 1 1 -0.1 -${R}"/></circle>
  ${nodes}</svg>`;
}

// 저장용 이미지: 움직임을 빼고 다 그려진 상태로
const still = (svg) => svg.replace(/<g data-fx="1">[\s\S]*?<\/g>/g, '').replace(/<animate(Transform|Motion)?\b[^>]*\/>/g, '').replace(/ stroke-dashoffset="\d+"/g, '').replace(/ opacity="0"/g, '');

const LANG_LIST = [['ko', '한국어', 'KO'], ['en', 'English', 'EN'], ['th', 'ภาษาไทย', 'TH'], ['vi', 'Tiếng Việt', 'VI']];
const PACKS = window.SajuLang ? window.SajuLang({ G, C, W, D, hz, esc }) : {};
let lang = 'ko', T = KO, EL = KO.el;
const pickLang = () => {
  let q = null;
  try { q = new URLSearchParams(location.search).get('lang'); } catch (e) { /* 주소를 못 읽으면 무시 */ }
  if (q && LANG_LIST.some(([c]) => c === q)) return q;
  // 배포본은 주소마다 언어가 정해져 있다 (/korean-name 영어, /th/korean-name 태국어, /vi/korean-name 베트남어)
  const pm = document.querySelector('meta[name="kc-lang"]'), pl = pm && pm.content;
  if (pl && (pl === 'ko' || PACKS[pl])) return pl;
  try { const s = localStorage.getItem('kc_saju_lang'); if (s && LANG_LIST.some(([c]) => c === s)) return s; } catch (e) { /* 저장소가 막혀 있으면 무시 */ }
  const nav = ((navigator.languages && navigator.languages[0]) || navigator.language || 'ko').toLowerCase();
  if (nav.startsWith('ko')) return 'ko';
  if (nav.startsWith('th') && PACKS.th) return 'th';
  if (nav.startsWith('vi') && PACKS.vi) return 'vi';
  return PACKS.en ? 'en' : 'ko';
};

  const cnt = ds.elements, max = Math.max(...cnt), main = dr.target.main;

/* 생년월일·시각 고르기 상자. 휴대폰 날짜 칸은 휴대폰 언어로만 보이고 아이폰에서 칸이 어긋나서,

const pad2 = (n) => String(n).padStart(2, '0');
const MON_EN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MON_TH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const DT = {
  ko: { y: '연도', m: '월', d: '일', h: '시', mi: '분', yl: (y) => `${y}년`, ml: (m) => `${m}월`, dl: (d) => `${d}일`,
    hl: (h) => `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}시`, mil: (m) => `${pad2(m)}분` },
  en: { y: 'Year', m: 'Month', d: 'Day', h: 'Hour', mi: 'Minute', yl: (y) => `${y}`, ml: (m, lunar) => (lunar ? `Month ${m}` : MON_EN[m - 1]), dl: (d) => `${d}`,
    hl: (h) => `${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}`, mil: (m) => `${pad2(m)} min` },
  // 태국은 불기를 많이 쓴다: 서기와 불기(서기+543)를 같이 보여 준다
  th: { y: 'ปี', m: 'เดือน', d: 'วัน', h: 'ชั่วโมง', mi: 'นาที', yl: (y) => `${y} / ${y + 543}`, ml: (m, lunar) => (lunar ? `เดือน ${m}` : MON_TH[m - 1]), dl: (d) => `${d}`,
    hl: (h) => `${h} นาฬิกา`, mil: (m) => `${pad2(m)} นาที` },
  // 베트남은 날짜를 숫자로 적는다(07/03/1990). 칸 이름이 "Tháng"이라 숫자만 둔다
  vi: { y: 'Năm', m: 'Tháng', d: 'Ngày', h: 'Giờ', mi: 'Phút', yl: (y) => `${y}`, ml: (m) => `${m}`, dl: (d) => `${d}`,
    hl: (h) => `${h} giờ`, mil: (m) => `${pad2(m)} phút` },
};
function syncDT() {
  const y = +$('bdY').value, m = +$('bdM').value, d = +$('bdD').value;
  $('bd').value = y && m && d ? `${y}-${pad2(m)}-${pad2(d)}` : '';
  $('bt').value = `${pad2(+$('btH').value)}:${pad2(+$('btMi').value)}`;
}
function fillDT() {
  const L = DT[lang] || DT.en, lunar = cal === 'lunar';
  const keep = { y: $('bdY').value, m: $('bdM').value, d: $('bdD').value, h: $('btH').value, mi: $('btMi').value };
  const opts = (el, ph, list, val) => {
    el.innerHTML = (ph ? `<option value="">${esc(ph)}</option>` : '') + list.map(([v, t]) => `<option value="${v}">${esc(t)}</option>`).join('');
    if (val !== '' && [...el.options].some((o) => o.value === String(val))) el.value = String(val);
  };
  const ys = []; for (let y = new Date().getFullYear() + 1; y >= 1900; y--) ys.push([y, L.yl(y)]);
  opts($('bdY'), L.y, ys, keep.y);
  opts($('bdM'), L.m, Array.from({ length: 12 }, (_, i) => [i + 1, L.ml(i + 1, lunar)]), keep.m);
  const y = +$('bdY').value, m = +$('bdM').value;
  const nd = lunar ? 30 : y && m ? new Date(y, m, 0).getDate() : 31;
  opts($('bdD'), L.d, Array.from({ length: nd }, (_, i) => [i + 1, L.dl(i + 1)]), keep.d && +keep.d > nd ? nd : keep.d);
  opts($('btH'), '', Array.from({ length: 24 }, (_, h) => [h, L.hl(h)]), keep.h || 12);
  opts($('btMi'), '', Array.from({ length: 60 }, (_, i) => [i, L.mil(i)]), keep.mi || 0);
  [['bdY', L.y], ['bdM', L.m], ['bdD', L.d], ['btH', L.h], ['btMi', L.mi]].forEach(([id, t]) => $(id).setAttribute('aria-label', t));
  syncDT();
}

/* ───────── 계산 ───────── */
function compute() {
  let [cy, cm, cd] = $('bd').value.split('-').map(Number);
  // 태국 불기(서기+543)로 넣은 연도는 서기로 바꾼다. 입력 범위 1900~2100 과 겹치지 않아 다른 입력에는 영향이 없다
  if (cy > 2400) cy -= 543;
  const [, tz, lon, lunarBase] = COUNTRIES[+$('country').value][1][+$('city').value];
  let y = cy, m = cm, d = cd;
  if (cal === 'lunar') {
    const ltz = lunarBase === 'vnN' ? G.vnLunarTz(cy, cm, cd, 'north') : lunarBase === 'vnS' ? G.vnLunarTz(cy, cm, cd, 'south') : lunarBase === 'cn' ? 8 : 9;
    const r = G.lunarToSolar(cy, cm, cd, $('leap').checked, ltz);
    if (!r) return { error: 'errLunar' };
    ({ y, m, d } = r);
  }
  const unknown = $('nt').checked;
  const [h, mi] = unknown ? [12, 0] : ($('bt').value || '12:00').split(':').map(Number);
  const s = G.saju({ y, m, d, h, mi, tz, lon, hourUnknown: unknown });
  const si = +$('sn').value;
  const sur = si >= 0 ? SUR[si] : null;
  const r = N.run(s, sex, sur);
  return { s, sur, r };
}

const elSpan = (e, t) => `<b class="e${e}">${t || EL[e]}</b>`;
const mother = (e) => (e + 4) % 5;
// 이름 소리의 기운 길: naming_engine soundCheck(해례본)와 같은 길을 같은 순서로 보고, 판정에 맞는 첫 길을 글자로 보여 준다
function soundPath(full, level) {
  const node = (j) => ({ j, e: j ? J.soundEl(j, 'haerye') : undefined });
  const L = [...full].map((ch) => { const d = J.decompose(ch); return { cho: node(d.cho), jong: d.jong ? node(d.jong) : null }; });
  const [s, m, e] = L.length === 3 ? L : [L[0], L[1], null];
  const routes = [e ? [s.cho, m.cho, e.cho] : [s.cho, m.cho]];
  if (s.jong) routes.push(e ? [s.jong, m.cho, e.cho] : [s.jong, m.cho]);
  if (e && s.jong && m.jong) routes.push([s.jong, m.cho, m.jong, e.cho]);
  const sheng = (a, b) => (a + 1) % 5 === b || (b + 1) % 5 === a, ke = (a, b) => (a + 2) % 5 === b || (b + 2) % 5 === a;
  const okR = (r) => r.every((x) => x.e !== undefined) && r.every((x, i) => i === 0 || (level === 'good' ? sheng(r[i - 1].e, x.e) : !ke(r[i - 1].e, x.e)));
  const r = routes.find(okR) || routes[0];
  return r.map((x) => `${x.j}(${EL[x.e]})`).join(' → ');
}

const HELP_SIDE = ['비겁', '인성'];

  const dotsN = Math.max(5, ...cnt);

  $('p1').innerHTML = `

      <div class="v4card">${stemCard(dm)}</div>
      <p class="v4k">${T.hSec.me}</p>

      <p class="v4mean">${T.stemMean[dm]}</p>
      <p class="v4body v4c">${T.dmRead[dm]}</p>
    </section>
    <section class="v4s rv" id="v4five">
      <p class="v4k">${T.hSec.five}</p>
      <p class="v4body v4c">${T.hTeach.five}</p>
