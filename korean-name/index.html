<style>
:root{
  --bg:#111526; --bg2:#181d34; --panel:#1f2747; --line:#333f6a;
  --ink:#f4efe4; --ink2:#cbc5b7; --ink3:#918b80;
  --gold:#e0bd63; --gold2:#b8954a; --cream:#f6eddb; --brown:#2a2418;
  --e0:#7fd3a6; --e1:#ff8a6b; --e2:#f0c35a; --e3:#e6ecf2; --e4:#86b8ec;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 50% -200px,#26305a 0%,var(--bg) 60%) no-repeat,var(--bg)}
main{max-width:560px;margin:0 auto;padding:0 16px 64px}
h1,h2,h3{font-family:'Noto Serif KR',serif;line-height:1.3;margin:0;word-break:keep-all}
h1{font-size:31px;font-weight:900}
h2{font-size:22px;font-weight:900;margin:38px 0 6px}
h3{font-size:16.5px;font-weight:700;margin:0 0 6px}
p{margin:.5em 0;word-break:keep-all}
.muted{color:var(--ink2)} .tiny{font-size:12.5px;color:var(--ink3)}
.copy{text-align:center;font-size:11.5px;color:var(--ink3);padding:28px 16px 36px;letter-spacing:.2px}
.hz{font-size:.8em;color:var(--ink3);font-weight:500;white-space:nowrap}
.kicker{display:inline-block;font-size:12px;letter-spacing:3px;color:var(--gold);border:1px solid var(--gold2);border-radius:999px;padding:2px 12px;margin-bottom:12px}
.no{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1d1a12;font-size:14px;font-weight:900;margin-right:8px;vertical-align:3px;font-family:'Noto Sans KR',sans-serif}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;background:var(--gold);color:#1d1a12;margin-top:16px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.86) rotate(-3deg)}to{opacity:1;transform:none}}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* 첫 화면 */
.hero{text-align:center;padding:30px 0 6px}
.hero .sub{font-size:16px;color:var(--gold);margin:10px 0 0;font-weight:700}
.story{text-align:left;font-size:14px;color:var(--ink2);line-height:1.75;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 2px;margin:4px 0 0}
.story p{margin:.45em 0}
.story b{color:var(--ink)}
.lamp{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:500;line-height:1.8;color:var(--cream);margin:14px 6px 0}
.cta{margin:34px 0 0;padding:20px 16px;text-align:center;border:1px solid var(--gold2);border-radius:18px;background:linear-gradient(160deg,#2a3360,#1d2443)}
.cta p{margin:0;font-family:'Noto Serif KR',serif;font-size:17px;line-height:1.7}
.formh{text-align:center;margin:30px 0 4px;font-size:20px}
.fan{position:relative;height:236px;margin:20px auto 6px;width:300px}
.fan svg{position:absolute;width:120px;top:8px;left:90px;filter:drop-shadow(0 12px 20px rgba(0,0,0,.5))}
.fan svg:nth-child(1){transform:rotate(-14deg) translateX(-72px)}
.fan svg:nth-child(2){animation:float 4s ease-in-out infinite}
.fan svg:nth-child(3){transform:rotate(14deg) translateX(72px)}
.stat{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;background:linear-gradient(135deg,#2a3360,#1f2747);border:1px solid var(--gold2);border-radius:16px;padding:14px 16px;margin:16px 0}
.stat .big{font-family:'Noto Serif KR',serif;font-size:38px;font-weight:900;color:var(--gold);line-height:1}
.stat p{margin:0;font-size:14.5px}
.steps3{display:grid;gap:8px;margin:14px 0;text-align:left}
.steps3 div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.basis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px;text-align:left}
.basis div{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;color:var(--ink2);background:#181e38}
.basis b{display:block;color:var(--gold);font-size:13.5px;margin-bottom:2px}

/* 입력 */
form{margin-top:18px}
form .row{display:grid;gap:6px;margin:14px 0}
label.l{font-size:13.5px;font-weight:700;color:var(--ink2)}
label.l em{font-style:normal;color:var(--gold)}
input,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px}
input:focus,select:focus,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{font:inherit;font-size:16px;font-weight:700;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1d1a12;border-color:var(--gold)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.chk input{width:18px;height:18px}
.inline{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.err{color:#ff9b8a;font-size:14px;min-height:1.2em}

/* 계산 중 */
#loading{position:fixed;inset:0;z-index:50;background:rgba(10,12,24,.94);display:none;place-items:center;text-align:center}
#loading.on{display:grid}
#loading .cards{display:flex;gap:10px;justify-content:center;margin-bottom:18px;perspective:600px}
#loading svg{width:78px;animation:flip 1.1s ease-in-out infinite}
#loading svg:nth-child(2){animation-delay:.18s}
#loading svg:nth-child(3){animation-delay:.36s}
#loading .msg{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;color:var(--gold);min-height:1.6em}

/* 결과 */
#result{display:none;animation:rise .5s ease both}
.top{position:sticky;top:0;z-index:20;background:rgba(17,21,38,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.home{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-decoration:none;border-radius:10px;-webkit-tap-highlight-color:transparent}
.home:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.klogo{flex:none;width:30px;height:30px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.65)) drop-shadow(0 0 8px rgba(224,189,99,.35))}
.brand{font-family:'Noto Serif KR',serif;font-weight:900;font-size:19px;letter-spacing:.5px;color:var(--gold);padding:2px 0;
  background:linear-gradient(180deg,#fff3cf 0%,#ecc970 48%,#c08f30 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.65)) drop-shadow(0 0 9px rgba(224,189,99,.38))}
.home:hover .brand{filter:drop-shadow(0 1px 0 rgba(0,0,0,.65)) drop-shadow(0 0 12px rgba(224,189,99,.6))}
html:not([lang="ko"]) .brand{font-size:16px;letter-spacing:0}
.mycard{display:grid;grid-template-columns:116px 1fr;gap:16px;align-items:center;margin-top:12px;padding:14px 14px 14px 12px;border-radius:20px;border:1px solid var(--line);border-color:color-mix(in srgb,var(--c) 45%,transparent);background:#151a33;background:radial-gradient(130% 150% at 0% 50%,color-mix(in srgb,var(--c) 24%,transparent),transparent 72%),#151a33}
.mycard svg{width:116px;filter:drop-shadow(0 14px 24px rgba(0,0,0,.5));animation:pop .7s cubic-bezier(.2,.8,.2,1.2) both}
.mycard .mi{min-width:0}
.mycard .ml{font-size:12.5px;font-weight:700;color:var(--c);letter-spacing:.5px}
.mycard .nm{font-family:'Noto Serif KR',serif;font-size:34px;font-weight:900;line-height:1.2;margin-top:2px;color:var(--cream)}
.mycard .nmh{display:inline-block;white-space:nowrap;font-size:22px;font-weight:700;color:var(--c);margin-left:8px}
html:not([lang="ko"]) .mycard .nm{font-size:27px}
html:not([lang="ko"]) .mycard .nmh{font-size:19px;margin-left:6px}
html:not([lang="ko"]) .headline{font-size:19px}
html:not([lang="ko"]) .headline b,html:not([lang="ko"]) .headline .hn{font-size:22px}
.mycard .mm{font-size:15px;line-height:1.5;color:var(--ink2);margin:6px 0 0;word-break:keep-all}
.mycard .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
@media (min-width:520px){.mycard{grid-template-columns:136px 1fr;gap:24px;padding:18px 24px 18px 18px}.mycard svg{width:136px}.mycard .nm{font-size:42px}.mycard .nmh{font-size:26px}.mycard .mm{font-size:16.5px}}
.cntbox{margin-top:14px;padding:18px 8px 12px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.035)}
.cntbox .orbs{margin:16px 0 0;gap:4px}
@media (max-width:400px){.cntbox{padding-left:4px;padding-right:4px}.cntbox .orb{width:50px;height:50px}.cntbox .orb .ei{width:24px;height:24px}}
.tagc{font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;background:#2b3460;color:var(--ink2)}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.pcol{display:grid;gap:8px}
.ph{font-size:12px;color:var(--ink3);text-align:center;white-space:nowrap}
.tile{position:relative;border-radius:12px;padding:8px 4px;text-align:center;background:#252e55;border:2px solid transparent}
.tile .k{font-family:'Noto Serif KR',serif;font-size:27px;font-weight:900;line-height:1.15}
.tile .w{font-size:12.5px;font-weight:700}
.tile.me{border-color:var(--gold)}
.tile .tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1d1a12;font-size:10.5px;font-weight:900;border-radius:999px;padding:0 8px;white-space:nowrap}
.tile.empty{opacity:.45}
.e0{color:var(--e0)}.e1{color:var(--e1)}.e2{color:var(--e2)}.e3{color:var(--e3)}.e4{color:var(--e4)}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:58px 1fr 30px;align-items:center;gap:8px;font-size:14.5px}
.bar .track{height:14px;border-radius:999px;background:#2a3258;overflow:hidden}
.bar .fill{height:100%;border-radius:999px;transition:width .8s ease}
.bar.need b{color:var(--gold)}
.yy{display:flex;height:26px;border-radius:999px;overflow:hidden;margin-top:12px;font-size:12.5px;font-weight:700}
.yy .y{background:#f1e6c8;color:var(--brown);display:grid;place-items:center}
.yy .n{background:#0b0e1c;color:#d9d3c5;display:grid;place-items:center;border:1px solid var(--line)}
.read p{margin:10px 0}
.how{margin-top:16px}
.how p{font-size:14px;color:var(--ink2);margin:8px 0;display:grid;grid-template-columns:44px 1fr;gap:8px}
.how p b{color:var(--gold);font-size:13px}
.read .key{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:900;color:var(--gold)}
.better{background:var(--cream);color:var(--brown);border-radius:16px;padding:16px;margin:14px 0}
.better h3{color:var(--brown)}
.better p{font-size:14.5px}
.pairs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.pairs div{background:#efe2c6;border-radius:10px;padding:8px 2px;text-align:center;font-size:12px;color:#6a5a3a}
.pairs b{display:block;font-size:15px;color:var(--brown)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:3px;border:1px solid #0003}
.names{display:grid;gap:14px;margin-top:12px}
.namecard{position:relative;padding:20px 16px 16px;text-align:center;border-radius:18px;background:linear-gradient(160deg,#f8f0de,#eee0c1);color:var(--brown);border:3px solid #c9a457;cursor:pointer;box-shadow:0 14px 28px rgba(0,0,0,.35);animation:pop .6s cubic-bezier(.2,.8,.2,1.2) both}
.namecard:nth-child(2){animation-delay:.12s}.namecard:nth-child(3){animation-delay:.24s}
.namecard.sel{outline:3px solid var(--gold);outline-offset:3px}
.namecard .rank{position:absolute;top:10px;left:12px;font-size:12px;font-weight:900;color:#8a6a2a}
.namecard .kind{position:absolute;top:10px;right:12px;font-size:11.5px;font-weight:900;color:#fff;background:#8a6a2a;border-radius:999px;padding:1px 9px}
.namecard .kind.w{background:#3f7f5a}
.namecard .ko{font-family:'Noto Serif KR',serif;font-size:42px;font-weight:900;letter-spacing:5px;line-height:1.15;margin-top:6px}
.namecard .ro{font-size:15.5px;font-weight:700;color:#5a4a2a}
.namecard .hj{font-size:15px;color:#7a6a4a;margin-top:2px}
.namecard .why{font-size:14.5px;margin:10px 0 0;text-align:left;background:#fff8ea;border-radius:12px;padding:10px 12px;line-height:1.6}
.chips{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px}
.chips .c0{background:#cfe9d9}.chips .c1{background:#f8d1c4}.chips .c2{background:#f3e0a6}.chips .c3{background:#e2e6ea}.chips .c4{background:#cfe0f3}
.namecard .act{display:flex;gap:8px;justify-content:center;margin-top:12px}
.namecard .act button{font:inherit;font-size:13.5px;font-weight:700;border:1px solid #c9a457;background:#fff8ea;color:var(--brown);border-radius:999px;padding:5px 14px;cursor:pointer}
.share{display:grid;justify-items:center;gap:10px;margin-top:18px}
.share img{width:min(78vw,280px);border-radius:16px;box-shadow:0 18px 30px rgba(0,0,0,.5)}
.sharebtns{display:flex;gap:8px;justify-content:center;margin-top:4px}
.sbtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:96px;height:38px;padding:0 14px;border-radius:999px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;border:0}
.sbtn svg{width:15px;height:15px;flex:none}
.sbtn.save{background:var(--cream);color:#2a2418}
.sbtn.send{background:var(--gold);color:#1d1a12;box-shadow:0 6px 16px rgba(224,189,99,.3)}
.sbtn:active{transform:translateY(1px)}
.sbtn:disabled{opacity:.9;cursor:default;font-size:13px}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
summary{cursor:pointer;font-weight:700}
details ol{padding-left:20px;margin:8px 0}
details li{margin:10px 0;font-size:14.5px;color:var(--ink2)}
details li b{color:var(--ink)}
/* 11/13 개편: 첫 화면 이야기, 기운 구슬, 풀이, 스크롤 등장 */
@keyframes sweep{from{background-position:100% 0}to{background-position:0 0}}
@keyframes roll{to{transform:translateY(calc(var(--n) * -52px))}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hero{padding:24px 0 0}
.hero h1{font-size:36px;background:linear-gradient(100deg,var(--cream) 38%,#fff3c4 50%,var(--cream) 62%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 2.4s ease .3s both}
.hero .sub{font-size:15.5px;color:var(--ink2);font-weight:500;line-height:1.75;margin-top:12px}
.tt{background:linear-gradient(100deg,var(--ink) 40%,#ffe9a8 50%,var(--ink) 60%);background-size:260% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.in .tt,.in.tt{animation:sweep 1.6s ease .25s both}
.blk{margin:52px 0 0}
.ih{font-size:23px;margin:0 0 12px;line-height:1.42}
.ih small{display:block;font-family:'Noto Sans KR',sans-serif;font-size:12px;letter-spacing:3px;color:var(--gold);font-weight:700;margin-bottom:8px}
.blk p{font-size:15px;color:var(--ink2);line-height:1.85}
.blk p b{color:var(--ink)}
.srcl{font-size:12px!important;color:var(--ink3)!important;margin:6px 0 0!important;line-height:1.6!important}
.srcl a{color:var(--ink3);text-underline-offset:2px}
/* 첫 화면 다섯 기운 */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.horbs{display:flex;justify-content:center;gap:12px;margin:16px 0 0}
form{margin-top:8px}
form>.row{margin:12px 0}
.err:empty{min-height:0}
.horbs span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--c);border:1.5px solid var(--c);background:#161c36;box-shadow:0 0 18px -4px var(--c);animation:bob 3.6s ease-in-out var(--d) infinite}
.horbs .ei{width:21px;height:21px}
/* 입력 두 칸 */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.row2>.row{margin:0;align-content:start}
/* 입력 이름표: 버튼 글자와 구분되게 밝고 크게, 버튼 글자는 한 단계 낮춤 */
form label.l,form span.l{font-size:14.5px;font-weight:700;color:var(--cream);letter-spacing:.2px}
form .seg button{font-weight:500;font-size:15.5px}
form .seg button[aria-pressed="true"]{font-weight:900}
.lh{display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:4px;min-height:27px}
.lh label.l,.seg.mini button{white-space:nowrap}
@media (max-width:370px){.seg.mini button{padding:2px 7px;font-size:12px!important}}
.row2>.row>label.l:first-child{min-height:27px;display:flex;align-items:center}
.seg.mini{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:999px;background:var(--bg2)}
.seg.mini button{position:relative;font-size:12.5px!important;font-weight:700;padding:2px 10px;border:0;border-radius:0;background:transparent;color:var(--ink)}
.seg.mini button:first-child{border-radius:999px 0 0 999px}.seg.mini button:last-child{border-radius:0 999px 999px 0}
/* 보이는 크기는 그대로, 누르는 곳만 위아래 44px로 넓힘 */
.seg.mini button::after{content:'';position:absolute;left:0;right:0;top:-11px;bottom:-11px}
.seg.mini button[aria-pressed="true"]{background:var(--gold);color:#1d1a12}

.chips button{font:inherit;display:flex;align-items:center;gap:10px;text-align:left;min-height:44px;border-radius:12px;padding:7px 8px 7px 12px;background:#e8d8b4;color:#4a3a1a;border:1px solid rgba(90,70,30,.18);cursor:pointer;box-shadow:0 2px 0 rgba(90,70,30,.18)}

.chips button::after{content:'+';flex:none;width:22px;height:22px;border-radius:50%;background:#8a6a2a;color:#fff;font-size:17px;font-weight:700;line-height:22px;text-align:center}

.glyphs{display:flex;justify-content:center;gap:10px;margin-top:10px}

.chips .c0{background:#cfe9d9}.chips .c1{background:#f8d1c4}.chips .c2{background:#f3e0a6}.chips .c3{background:#e2e6ea}.chips .c4{background:#cfe0f3}

.rv{opacity:0;transform:translateY(22px);filter:blur(6px);transition:opacity .9s ease var(--d,0s),transform 1s cubic-bezier(.2,.7,.2,1) var(--d,0s),filter .9s ease var(--d,0s)}

.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}

.kmini{width:14px;height:14px;flex:none}
.kcnav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 16px}

.lang{position:relative;flex:none}
.lang-btn{position:relative;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px 0 9px;border-radius:999px;border:1px solid var(--line);background:rgba(27,34,64,.85);color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.6px;cursor:pointer;transition:border-color .2s,background .2s}
.lang-btn::after{content:'';position:absolute;inset:-6px -2px}
.lang-btn:hover,.lang-btn[aria-expanded="true"]{border-color:var(--gold2);background:#232c52}
.lang-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lang-btn .gl{width:16px;height:16px;color:var(--gold)}
.lang-btn .cv{width:12px;height:12px;color:var(--ink3);transition:transform .2s}
.lang-btn[aria-expanded="true"] .cv{transform:rotate(180deg)}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:70;min-width:188px;margin:0;padding:6px;list-style:none;text-align:left;background:#1b2240;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 32px rgba(0,0,0,.5);animation:rise .18s ease both}
.lang-menu button{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.lang-menu button small{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--ink3)}
.lang-menu button:hover,.lang-menu button:focus-visible{background:#2b3460;outline:none}
.lang-menu button[aria-checked="true"]{color:var(--gold);font-weight:700}

.lang-menu button[aria-checked="true"] small::before{content:'✓ '}
.top .lslot{flex:none}
.top .lang-btn{height:30px}

@media (max-width:420px){.top .lang-btn{width:36px;height:36px;padding:0;justify-content:center}.top .lang-btn #langCode,.top .lang-btn .cv{display:none}.top .lang-btn .gl{width:19px;height:19px}.top .in{gap:10px}.klogo{width:28px;height:28px}.home{gap:9px}.brand{font-size:18px;letter-spacing:0}html:not([lang="ko"]) .brand{font-size:15.5px}}

.callow{display:flex;align-items:center;min-height:26px}
.callow[hidden]{display:none}

// 그레고리력 날짜 → 율리우스 일수(정수, 그날 정오)
function jdn(y, m, d) {
  const a = floor((14 - m) / 12);
  const yy = y + 4800 - a;
  const mm = m + 12 * a - 3;
  return d + floor((153 * mm + 2) / 5) + 365 * yy + floor(yy / 4) - floor(yy / 100) + floor(yy / 400) - 32045;
}
function jdnToDate(j) {
  const a = j + 32044;
  const b = floor((4 * a + 3) / 146097);
  const c = a - floor((146097 * b) / 4);
  const d = floor((4 * c + 3) / 1461);
  const e = c - floor((1461 * d) / 4);
  const m = floor((5 * e + 2) / 153);
  return { y: b * 100 + d - 4800 + floor(m / 10), m: m + 3 - 12 * floor(m / 10), d: e - floor((153 * m + 2) / 5) + 1 };
}

const fmtCache = {};
function tzOffsetMin(ms, tz) {
  if (!fmtCache[tz]) {
    fmtCache[tz] = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
    });
  }
  const s = floor(ms / 1000) * 1000; // 초 단위로 맞춰 소수점 오차 제거
  const o = {};
  for (const p of fmtCache[tz].formatToParts(new Date(s))) o[p.type] = p.value;
  return (Date.UTC(+o.year, +o.month - 1, +o.day, +o.hour, +o.minute, +o.second) - s) / 60000;
}
// 그 지역 벽시계 시각 → UTC ms
function localToUtcMs(y, m, d, h, mi, tz) {
  const wall = Date.UTC(y, m - 1, d, h, mi);
  let guess = wall - tzOffsetMin(wall, tz) * 60000;
  for (let i = 0; i < 3; i++) guess = wall - tzOffsetMin(guess, tz) * 60000;
  return guess;
}

const LEAP = [[1972, 10], [1972.5, 11], [1973, 12], [1974, 13], [1975, 14], [1976, 15], [1977, 16], [1978, 17], [1979, 18], [1980, 19],

function deltaT(year) {
  const y = year;
  if (y >= 1972) {
    let n = 10;

  }

  if (y < 1900) { t = y - 1860; return 7.62 + 0.5737 * t - 0.251754 * t * t + 0.01680668 * t ** 3 - 0.0004473624 * t ** 4 + t ** 5 / 233174; }
  if (y < 1920) { t = y - 1900; return -2.79 + 1.494119 * t - 0.0598939 * t * t + 0.0061966 * t ** 3 - 0.000197 * t ** 4; }

  if (y < 1961) { t = y - 1950; return 29.07 + 0.407 * t - (t * t) / 233 + t ** 3 / 2547; }

  if (y < 2005) { t = y - 2000; return 63.86 + 0.3345 * t - 0.060374 * t * t + 0.0017275 * t ** 3 + 0.000651814 * t ** 4 + 0.00002373599 * t ** 5; }

  if (y < 2150) { return -20 + 32 * ((y - 1820) / 100) ** 2 - 0.5628 * (2150 - y); }
  const u = (y - 1820) / 100; return -20 + 32 * u * u;
}

// 역학시(JDE) → 태양 겉보기 황경(도)
function sunApparentLongitude(jde) {
  const tau = (jde - 2451545) / 365250;
  const T = tau * 10;
  const L = (series(L0, tau) + series(L1, tau) * tau + series(L2, tau) * tau ** 2 + series(L3, tau) * tau ** 3 + series(L4, tau) * tau ** 4 + series(L5, tau) * tau ** 5) / 1e8;
  const R = (series(R0, tau) + series(R1, tau) * tau + series(R2, tau) * tau ** 2 + series(R3, tau) * tau ** 3 + series(R4, tau) * tau ** 4) / 1e8;
  let theta = mod(L / DR + 180, 360);
  theta += -0.09033 / 3600; // FK5 보정
  const omega = 125.04452 - 1934.136261 * T + 0.0020708 * T * T + T ** 3 / 450000;
  const Ls = 280.4665 + 36000.7698 * T;
  const Lm = 218.3165 + 481267.8813 * T;
  const dpsi = -17.2 * Math.sin(omega * DR) - 1.32 * Math.sin(2 * Ls * DR) - 0.23 * Math.sin(2 * Lm * DR) + 0.21 * Math.sin(2 * omega * DR);
  const aberr = -20.4898 / R;
  return mod(theta + (dpsi + aberr) / 3600, 360);
}

// UT 기준 JD에서 태양 황경
function sunLongitudeAtJdUT(jdUT) {
  const year = 2000 + (jdUT - 2451545) / 365.25;
  return sunApparentLongitude(jdUT + deltaT(year) / 86400);
}

// 태양 황경이 target(도)에 닿는 순간(UT 기준 JD). year는 그레고리력 연도
function solarTermJdUT(year, target) {
  const delta = target > 270 ? target - 360 : target; // 소한·대한·입춘·우수·경칩은 그해 1~3월, 동지(270°)는 12월
  let jd = jdn(year, 3, 20) - 0.5 + (delta * 365.2422) / 360;
  for (let i = 0; i < 50; i++) {
    let diff = mod(target - sunLongitudeAtJdUT(jd) + 180, 360) - 180;
    jd += (diff * 365.2422) / 360;
    if (Math.abs(diff) < 1e-8) break;
  }
  return jd;
}

function elRelation(a, b) {
  if (a === b) return 'same';
  if (mod(a + 1, 5) === b) return 'a_sheng_b';

// opts.solarTime: 'lmt'(출생지 경도 평균태양시, 기본) | 'apparent'(균시차까지) | 'clock'(입력 시각 그대로)
// opts.zi: '23'(밤 11시에 날짜가 바뀜, 기본) | '00'(야자시: 밤 11~12시는 그날, 시간은 다음 날 자시)
function equationOfTimeMin(jdUT) {
  const T = (jdUT - 2451545) / 36525;
  const L0_ = mod(280.46646 + 36000.76983 * T, 360);
  const lam = sunLongitudeAtJdUT(jdUT);
  const eps = 23.4392911 - 0.0130042 * T;
  const alpha = Math.atan2(Math.cos(eps * DR) * Math.sin(lam * DR), Math.cos(lam * DR)) / DR;
  let E = L0_ - 0.0057183 - mod(alpha, 360);
  E = mod(E + 180, 360) - 180;
  return E * 4;
}
function saju(p, opts = {}) {
  const solarTime = opts.solarTime || 'lmt';
  const zi = opts.zi || '23';
  const ms = localToUtcMs(p.y, p.m, p.d, p.h, p.mi, p.tz);
  const jdUT = jdFromMs(ms);
  const lam = sunLongitudeAtJdUT(jdUT);
  // 연주: 입춘(황경 315°) 기준
  let Y = p.y;
  if (p.m <= 2 && lam >= 270 && lam < 315) Y -= 1;
  const yi = yearIndex(Y);
  // 월주: 12절 기준
  const mIdx = floor(mod(lam - 315, 360) / 30); // 0=寅
  const mStem = mod(stemOf(yi) * 2 + 2 + mIdx, 10);
  const mBr = mod(mIdx + 2, 12);
  const mi60 = [...Array(60).keys()].find((i) => i % 10 === mStem && i % 12 === mBr);
  // 일주·시주: 출생지 태양시
  let localMs;
  if (solarTime === 'clock') localMs = Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi);
  else {
    localMs = ms + (p.lon / 15) * 3600000;
    if (solarTime === 'apparent') localMs += equationOfTimeMin(jdUT) * 60000;
  }
  const L = new Date(localMs);
  let dj = jdn(L.getUTCFullYear(), L.getUTCMonth() + 1, L.getUTCDate());
  const minutes = L.getUTCHours() * 60 + L.getUTCMinutes();
  const late = minutes >= 23 * 60;
  if (late && zi === '23') dj += 1;
  const di = mod(dj + 49, 60);
  const hBr = floor((minutes + 60) / 120) % 12;
  const stemBase = late && zi === '00' ? stemOf(di) + 1 : stemOf(di);
  const hStem = mod(stemBase * 2 + hBr, 10);
  const hi = p.hourUnknown ? null : [...Array(60).keys()].find((i) => i % 10 === hStem && i % 12 === hBr);
  const pillars = { year: ganzhi(yi), month: ganzhi(mi60), day: ganzhi(di), hour: hi === null ? null : ganzhi(hi) };
  const count = [0, 0, 0, 0, 0];
  for (const k of ['year', 'month', 'day', 'hour']) {
    if (!pillars[k]) continue;
    count[stemEl(pillars[k].stem)]++;
    count[BR_EL[pillars[k].br]]++;
  }
  return { pillars, dayMaster: pillars.day.stem, elements: count, sunLongitude: lam, sajuYear: Y };
}

  const STOP = new Set([1, 2, 3, 7, 17, 18, 19, 20, 22, 23, 24, 25, 26, 27]); // 소리가 ㄱ·ㄷ·ㅂ 으로 끝나는 받침
  function hardSyl(ch) {
    const c = ch.charCodeAt(0) - 0xac00;
    if (c < 0 || c > 11171) return false;
    return Math.floor(c / 588) === 18 && GLIDE.has(Math.floor(c / 28) % 21) && STOP.has(c % 28);
  }

  function target(s) {
    const y = J.yongsin(s);
    const jo = J.johu(s);
    const useJohu = !!(jo && jo.count === 0 && jo.need !== y.el);
    const main = useJohu ? jo.need : y.el;
    let second = mother(main);
    if (useJohu && !kills(y.el, main) && !kills(main, y.el)) second = y.el; // 조후를 앞에 두고 억부 기운을 뒤에
    return { main, second, useJohu, johu: jo, yong: y, counts: s.elements.slice() };
  }

  // 해례본이 판정 기준, 운해본은 가산점
  function sound(full) {
    const un = J.soundCheck(full, 'unhae'), ha = J.soundCheck(full, 'haerye');
    const ul = un ? un.level : 'clash', hl = ha ? ha.level : 'clash';
    return { un: ul, ha: hl, ok: hl !== 'clash', both: ul !== 'clash' && hl !== 'clash', pt: PT[hl] * 2 + PT[ul] };
  }

  // 다섯 기운이 얼마나 고르지 않은가 (분산). 이름 글자 기운을 더하기 전과 후를 비교한다
  const spread = (c) => { const m = c.reduce((a, b) => a + b, 0) / 5; return c.reduce((a, b) => a + (b - m) ** 2, 0) / 5; };
  function balanceGain(counts, els) {
    const after = counts.slice();
    for (const e of els) after[e]++;
    return spread(counts) - spread(after);
  }

  // 한자 이름 후보. level 0 이 가장 엄격하고, 3개가 안 나올 때만 한 단계씩 푼다
  function hanjaCandidates(t, gender, sur, level) {
    const list = gender === 'f' ? D.female : D.male;
    const out = [];
    list.forEach((name, idx) => {
      const [a, b] = [...name];
      if (hardSyl(a) || hardSyl(b)) return;
      const A = D.bySyl[a] || [], B = D.bySyl[b] || [];
      let best = null;
      for (const h1 of A) {
        const c1 = D.hanja[h1];
        if (c1.el !== t.main) continue;
        if (c1.g !== 'c' && c1.g !== gender && level < 2) continue;
        for (const h2 of B) {
          if (h2 === h1) continue;
          const c2 = D.hanja[h2];
          if (c2.g !== 'c' && c2.g !== gender && level < 2) continue;
          const secondOk = c2.el === t.second ? 2 : c2.el === t.main ? 1 : level >= 1 && !kills(c2.el, t.main) && !kills(t.main, c2.el) ? 0 : -1;
          if (secondOk < 0) continue;
          const strokes = sur ? [...sur.s, c1.s, c2.s] : [c1.s, c2.s];
          if (!J.strokeYinYang(strokes).ok) continue;
          let suri;
          if (sur) {
            suri = J.sagyeok(sur.s, [c1.s, c2.s]);
            const bad = ['원격', '형격', '이격', '정격'].filter((k) => suri[k].good !== true);
            // 마지막 단계에서만: 정격(총운)은 길수, 나머지 세 격 중 흉수 하나까지
            if (bad.length && !(level >= 3 && bad.length === 1 && bad[0] !== '정격')) continue;
            if (J.bunpa(sur.h + h1 + h2).split) continue;
          } else {
            suri = { 원격: J.suri(c1.s + c2.s) };
            if (!suri.원격.good) continue;
          }
          const snd = sound((sur ? sur.ko : '') + name);
          if (!snd.ok) continue;
          const suriPt = sur ? (suri.allGood ? 3 : 0) : suri.원격.good ? 2 : 0;
          const gain = balanceGain(t.counts, [c1.el, c2.el]);
          const score = 10 + secondOk * 3 + snd.pt + suriPt + gain * 2 + (c1.g === gender) + (c2.g === gender) + (1 - idx / list.length);
          if (!best || score > best.score) best = { type: 'hanja', given: name, h: h1 + h2, parts: [{ h: h1, ...c1 }, { h: h2, ...c2 }], sound: snd, suri, secondOk, gain, score };
        }
      }
      if (best) out.push(best);
    });
    return out.sort((x, y) => y.score - x.score);
  }

  // strict: 뜻 기운 = 넣을 기운, 소리는 해례본 상생 + 운해본 상극 없음 (세 번째 자리용)
  // loose : 뜻 기운 = 넣을 기운 또는 희신, 해례본 상극 없음 (한자 이름이 모자랄 때 채우는 용)
  function wooriCandidates(t, gender, sur, loose) {
    const out = [];
    for (const w of D.woori) {
      if ([...w.ko].some(hardSyl)) continue;
      if (w.el !== t.main && !(loose && w.el === t.second)) continue;
      if (w.g !== 'c' && w.g !== gender) continue;
      const snd = sound((sur ? sur.ko : '') + w.ko);
      if (!snd.ok) continue;
      if (!loose && (snd.ha !== 'good' || !snd.both)) continue;
      out.push({ type: 'woori', given: w.ko, el: w.el, h: null, parts: null, mean: w.mean, compound: w.compound, sound: snd, suri: null, score: 10 + (w.el === t.main ? 3 : 0) + snd.pt + (w.g === gender) - (w.compound ? 1 : 0) });
    }
    return out.sort((x, y) => y.score - x.score);
  }

  // 첫 글자와 끝 글자가 앞에 고른 이름과 겹치지 않는 것을 먼저 고른다
  function choose3(hj) {
    const chosen = [], f = new Set(), l = new Set(), any = new Set();
    // 앞에 고른 이름에 나온 음절은 자리를 바꿔도 쓰지 않는다 (지연·연지 같은 짝 방지)
    const fresh = (c) => !f.has(c.given[0]) && !l.has(c.given[1]) && !any.has(c.given[0]) && !any.has(c.given[1]);
    for (const c of hj) {
      if (chosen.length >= 3) break;
      if (!fresh(c)) continue;
      chosen.push(c); f.add(c.given[0]); l.add(c.given[1]); any.add(c.given[0]); any.add(c.given[1]);
    }
    for (const c of hj) {
      if (chosen.length >= 3) break;
      if (chosen.includes(c) || f.has(c.given[0])) continue;
      chosen.push(c); f.add(c.given[0]);
    }
    for (const c of hj) { if (chosen.length >= 3) break; if (!chosen.includes(c)) chosen.push(c); }
    return chosen;
  }

  // 세 개를 고른다. 단계: 0 엄격 → 1 끝 글자 기운 완화 → 2 글자 남녀 느낌 완화 → 순우리말로 채움 → 3 사격 흉수 하나 허용(정격은 길수)
  function pick(t, gender, sur) {
    let level = 0, hj = [];
    for (; level <= 2; level++) {
      hj = hanjaCandidates(t, gender, sur, level);
      if (hj.length >= 3 && new Set(hj.map((c) => c.given[0])).size >= 2) break;
    }
    if (level > 2) level = 2;
    let chosen = choose3(hj);
    const wr = wooriCandidates(t, gender, sur, false);
    if (wr.length && chosen.length >= 3) chosen[2] = wr[0];
    if (chosen.length < 3) {
      for (const w of wooriCandidates(t, gender, sur, true)) { if (chosen.length >= 3) break; if (!chosen.some((c) => c.given === w.given)) chosen.push(w); }
    }
    if (chosen.length < 3) {
      level = 3;
      const more = hanjaCandidates(t, gender, sur, 3).filter((c) => !chosen.some((x) => x.given === c.given));
      chosen = [...chosen, ...choose3(more)].slice(0, 3);
    }
    return { names: chosen.slice(0, 3).map((c) => ({ ...c, roman: J.romanizeGiven(c.given), romanH: J.romanizeGiven(c.given, true) })), level, pool: hj.length, woori: wr.length };
  }
  function run(s, gender, sur) {
    const t = target(s);
    const r = pick(t, gender, sur);
    return { target: t, ...r };
  }

  return { target, sound, hanjaCandidates, wooriCandidates, pick, run };
});

<script>/* emblem.js */

    <rect y="72" x="-90" width="180" height="20" fill="#5a3f0e"/></g><circle r="78" fill="none" stroke="#e9b544" stroke-opacity=".5" stroke-width="2"/>`,

const icon = (e, cls = '') => `<svg class="ei ${cls}" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" fill-opacity=".22" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">${ICON_PATH[e]}</svg>`;

// 상생(바깥 고리)·상극(안쪽 별) 그림. words: ['나무','불',...]
function ring(words) {
  const R = 92, pt = (k, r = R) => { const a = (-90 + k * 72) * Math.PI / 180; return [Math.cos(a) * r, Math.sin(a) * r]; };
  const arcs = [0, 1, 2, 3, 4].map((k) => {
    const [x1, y1] = pt(k + .2), [x2, y2] = pt(k + .8);

  }).join('');
  const starL = [0, 1, 2, 3, 4].map((k) => { const [x1, y1] = pt(k, 66), [x2, y2] = pt(k + 2, 66); return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#ff9b8a" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 4"/>`; }).join('');
  const nodes = [0, 1, 2, 3, 4].map((k) => {
    const [x, y] = pt(k);
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="27" fill="#1b2240" stroke="${EC[k]}" stroke-width="2.5"/><g transform="translate(-11 -17) scale(.92)" color="${EC[k]}">${ICON_PATH[k].replace(/<path /g, '<path fill="currentColor" fill-opacity=".22" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" ')}</g><text y="19" text-anchor="middle" font-family="Noto Sans KR,sans-serif" font-size="11" font-weight="700" fill="${EC[k]}">${words[k]}</text></g>`;
  }).join('');
  return `<svg viewBox="-130 -130 260 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="다섯 기운의 상생과 상극"><defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#e0bd63"/></marker></defs>
  ${starL}${arcs}
  <circle r="5" fill="#fff3c4"><animateMotion dur="10s" repeatCount="indefinite" path="M0 -${R} A${R} ${R} 0 1 1 -0.1 -${R}"/></circle>
  ${nodes}</svg>`;
}

// 저장용 이미지: 움직임을 빼고 다 그려진 상태로
const still = (svg) => svg.replace(/<g data-fx="1">[\s\S]*?<\/g>/g, '').replace(/<animate(Transform|Motion)?\b[^>]*\/>/g, '').replace(/ stroke-dashoffset="\d+"/g, '').replace(/ opacity="0"/g, '');

window.Emblem = { card, icon, ring, still, EC, ED };
})();

/* ───────── 언어: 한국어 묶음 위에 고른 언어 묶음을 덮는다 ───────── */
const LANG_LIST = [['ko', '한국어', 'KO'], ['en', 'English', 'EN'], ['th', 'ภาษาไทย', 'TH'], ['vi', 'Tiếng Việt', 'VI']];
const PACKS = window.SajuLang ? window.SajuLang({ G, C, W, D, hz, esc }) : {};
let lang = 'ko', T = KO, EL = KO.el;
const pickLang = () => {
  let q = null;
  try { q = new URLSearchParams(location.search).get('lang'); } catch (e) { /* 주소를 못 읽으면 무시 */ }
  if (q && LANG_LIST.some(([c]) => c === q)) return q;
  // 배포본은 주소마다 언어가 정해져 있다 (/korean-name 영어, /th/korean-name 태국어, /vi/korean-name 베트남어)
  const pm = document.querySelector('meta[name="kc-lang"]'), pl = pm && pm.content;
  if (pl && (pl === 'ko' || PACKS[pl])) return pl;
  try { const s = localStorage.getItem('kc_saju_lang'); if (s && LANG_LIST.some(([c]) => c === s)) return s; } catch (e) { /* 저장소가 막혀 있으면 무시 */ }
  const nav = ((navigator.languages && navigator.languages[0]) || navigator.language || 'ko').toLowerCase();
  if (nav.startsWith('ko')) return 'ko';
  if (nav.startsWith('th') && PACKS.th) return 'th';
  if (nav.startsWith('vi') && PACKS.vi) return 'vi';
  return PACKS.en ? 'en' : 'ko';
};

/* ───────── 스크롤 등장: 화면에 들어오면 아래에서 떠오르며 또렷해진다 ───────── */
const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const io = !calm && 'IntersectionObserver' in window
  ? new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: 0.12 })
  : null;
function reveal(root, now) {
  root.querySelectorAll('[data-stag]').forEach((g) => [...g.children].forEach((c, i) => { c.classList.add('rv'); c.style.setProperty('--d', `${(i * 0.13).toFixed(2)}s`); }));
  root.querySelectorAll('.rv').forEach((el) => (io && !now ? io.observe(el) : el.classList.add('in')));
  if (calm) root.querySelectorAll('svg').forEach((s) => s.pauseAnimations && s.pauseAnimations());

/* ───────── 계산 ───────── */
function compute() {
  let [cy, cm, cd] = $('bd').value.split('-').map(Number);
  // 태국 불기(서기+543)로 넣은 연도는 서기로 바꾼다. 입력 범위 1900~2100 과 겹치지 않아 다른 입력에는 영향이 없다
  if (cy > 2400) cy -= 543;
  const [, tz, lon, lunarBase] = COUNTRIES[+$('country').value][1][+$('city').value];
  let y = cy, m = cm, d = cd;
  if (cal === 'lunar') {
    const ltz = lunarBase === 'vnN' ? G.vnLunarTz(cy, cm, cd, 'north') : lunarBase === 'vnS' ? G.vnLunarTz(cy, cm, cd, 'south') : lunarBase === 'cn' ? 8 : 9;
    const r = G.lunarToSolar(cy, cm, cd, $('leap').checked, ltz);
    if (!r) return { error: 'errLunar' };
    ({ y, m, d } = r);
  }
  const unknown = $('nt').checked;
  const [h, mi] = unknown ? [12, 0] : ($('bt').value || '12:00').split(':').map(Number);
  const s = G.saju({ y, m, d, h, mi, tz, lon, hourUnknown: unknown });
  const si = +$('sn').value;
  const sur = si >= 0 ? SUR[si] : null;
  const r = N.run(s, sex, sur);
  return { s, sur, r };
}

const elSpan = (e, t) => `<b class="e${e}">${t || EL[e]}</b>`;
const mother = (e) => (e + 4) % 5;
// 이름 소리의 기운 길: naming_engine soundCheck(해례본)와 같은 길을 같은 순서로 보고, 판정에 맞는 첫 길을 글자로 보여 준다
function soundPath(full, level) {
  const node = (j) => ({ j, e: j ? J.soundEl(j, 'haerye') : undefined });
  const L = [...full].map((ch) => { const d = J.decompose(ch); return { cho: node(d.cho), jong: d.jong ? node(d.jong) : null }; });
  const [s, m, e] = L.length === 3 ? L : [L[0], L[1], null];
  const routes = [e ? [s.cho, m.cho, e.cho] : [s.cho, m.cho]];
  if (s.jong) routes.push(e ? [s.jong, m.cho, e.cho] : [s.jong, m.cho]);
  if (e && s.jong && m.jong) routes.push([s.jong, m.cho, m.jong, e.cho]);
  const sheng = (a, b) => (a + 1) % 5 === b || (b + 1) % 5 === a, ke = (a, b) => (a + 2) % 5 === b || (b + 2) % 5 === a;
  const okR = (r) => r.every((x) => x.e !== undefined) && r.every((x, i) => i === 0 || (level === 'good' ? sheng(r[i - 1].e, x.e) : !ke(r[i - 1].e, x.e)));
  const r = routes.find(okR) || routes[0];
  return r.map((x) => `${x.j}(${EL[x.e]})`).join(' → ');
}
const words = (list) => list.map((e) => EL[e]).join('·');
const HELP_SIDE = ['비겁', '인성'];
// 많은 기운이 판정과 반대쪽이면 한 줄 덧붙인다 (예: 같은 기운이 많아도 달의 땅 글자가 두 번 세어져 약한 사주)
const turnNote = (rl, weak) => (HELP_SIDE.includes(rl) === weak ? T.turnAgainst(weak) : (rl === '비겁' ? T.turnSame : ''));

function render({ s, sur, r }, keep) {
  const y0 = window.scrollY;
  $('start').style.display = 'none'; $('result').style.display = 'block'; $('topbar').hidden = false; placeLang();
  if (!keep) window.scrollTo(0, 0);
  const dm = s.dayMaster, dmEl = dm >> 1, P = s.pillars;
  const t = r.target, st = t.yong.strength;
  const cnt = s.elements;
  const relOf = (e) => (e === dmEl ? '비겁' : J.role(dmEl, e));
  const max = Math.max(...cnt);
  const many = cnt.map((n, i) => (n >= 3 ? i : -1)).filter((i) => i >= 0);
  const lack = cnt.map((n, i) => (n === 0 ? i : -1)).filter((i) => i >= 0);
  const most = cnt.map((n, i) => (n === max ? i : -1)).filter((i) => i >= 0);

  // ① 기운 구슬: 많음(3개 이상)·없음(0개)을 한눈에. 구슬이 찬 높이 = 개수(4개 이상이면 가득)
  // 기운 이름은 그 기운 색, 개수는 금색으로 키워 한 줄이 먼저 읽히게 한다
  const wordsH = (list) => list.map((e) => elSpan(e)).join('·');

    return `<div class="pcol"><div class="ph">${T.pos[k]}</div>
      ${tileHtml(k, 'stem', G.stemEl(p.stem), p.stem)}
      ${tileHtml(k, 'br', G.BR_EL[p.br], p.br)}</div>`;
  };
  $('p1').innerHTML = `<h2 id="p1h" class="rv"><span class="no" translate="no">1</span><span class="tt">${T.p1}</span></h2>
    <div class="mycard rv" style="--c:${E.EC[dmEl]}">${stemCard(dm)}<div class="mi"><div class="ml">${T.meLabel}</div><div class="nm" translate="no">${T.stemName[dm]}<span class="nmh">${G.STEM_H[dm] + C.EL_H[dmEl]}</span></div>
    <p class="mm">${T.stemMean[dm]}</p>
    <div class="tags"><span class="tagc">${T.dmTag(EL[dmEl])}</span><span class="tagc">${T.animal(T.animals[P.year.br])}</span></div></div></div>
    <div class="cntbox rv"><p class="headline">${headline}</p>
    <div class="orbs">${orbs}</div></div>
    <div class="keyline rv" style="--c:${E.EC[r.target.main]}">${T.keyLine}${E.icon(r.target.main)}<b>${EL[r.target.main]}</b></div>`;
  const p8 = `<h3 class="p8h rv">${T.p8h}</h3><p class="muted rv" style="margin:0;font-size:14px">${T.p8Lead}</p>
    <div class="pillars rv">${['year', 'month', 'day', 'hour'].map(col).join('')}</div>`;

  // ② 풀이: 한 줄 판정 → 여덟 글자 → 나 → 많고 빈 기운 → 나의 힘 → 넣을 기운 → 음양 → 생활
  const weak = st.verdict === '신약';
  const me = EL[dmEl];
  // 많은 기운이 판정과 반대쪽(예: 같은 기운이 많은데 약한 사주)이거나 빈 기운이 없으면 '많지만'
  const against = many.some((e) => HELP_SIDE.includes(relOf(e)) === weak);
  const soft = !!(lack.length && !against);
  const thesis = T.thesis(many.length ? words(many) : '', soft, lack.length ? words(lack) : '', weak);
  const rows = [0, 1, 2, 3, 4].map((e) => {

    const wy = (weak ? T.skipWhy.weak : T.skipWhy.strong)[rl];
    skipLine = T.skipLine(elSpan(e), EL[e], wy, mainW);
  }
  const yy = J.yinYang(s);
  const wv = Object.assign({}, W[t.main], T.wol ? T.wol[t.main] : {});
  const [pl1, pl2] = T.powerL(st.help, st.drain);
  const [yl1, yl2] = T.yyL(yy.yang, yy.yin);
  $('p2').innerHTML = `<h2 id="p2h" class="rv"><span class="no" translate="no">3</span><span class="tt">${T.p2}</span></h2>

    <div class="panel rv dmread" style="--c:${E.EC[dmEl]}"><div class="icb">${E.icon(dmEl)}</div><div><b>${T.dmPrefix} · <span translate="no">${T.stemName[dm]}</span></b><p>${T.dmRead[dm]}</p></div></div>

    <div class="panel power rv"><h3>${T.powerH}</h3>
      <div class="pl"><span>${pl1}</span><span>${pl2}</span></div>

      <p style="margin:0"><span class="verdict">${T.verdict(weak)}</span>${st.balanced ? `<span class="tiny">${T.balanced}</span>` : ''}</p>
      <p class="tiny" style="margin:8px 0 0">${T.powerP}</p></div>
    <div class="keyc rv" style="--c:${E.EC[t.main]}"><div class="big">${E.icon(t.main)}</div><div><div class="k1">${T.keyK1}</div><div class="k2">${mainW}</div></div></div>
    <p class="keyp rv">${why}</p>${skipLine ? `<p class="keyp rv muted">${skipLine}</p>` : ''}
    <div class="panel rv"><h3>${T.yyH}</h3><div class="yy"><div class="y" style="flex:${yy.yang || 0.001}"></div><div class="n" style="flex:${yy.yin || 0.001}"></div></div><div class="pl"><span>${yl1}</span><span>${yl2}</span></div>
    <p class="yyread">${T.yyRead(yy.yang, yy.yin)}</p></div>
    <div class="better rv"><h3>${T.betterTitle(mainW)}</h3><p>${T.betterLead}</p>
    <div class="pairs">${[[`<span class="swatch" style="background:${wv.colorHex}"></span>${wv.color}`], [wv.dir], [wv.season], [wv.num], [wv.taste]].map(([v], i) => `<div>${T.pairHead[i]}<b>${v}</b></div>`).join('')}</div>
    <div class="dolist">${T.doLine(wv).map((v, i) => `<p><b>${T.doHead[i]}</b><span>${v}</span></p>`).join('')}</div>
    <p class="tiny" style="color:#8a7a5a;margin-top:10px">${T.betterSrc(wv)}</p></div>
    <p class="src rv">${T.src2}</p>`;

  // ③ 이름 3개
  const names = r.names;
  // 칩 = 버튼. 누르면 그 칩의 뜻이 카드 안에 펼쳐진다
  // 글자 앞부분(무엇)과 뒷부분(결과)을 나눠 두 줄로 보인다. "가운데 글자: 흙 기운" → 작은 글씨 + 굵은 글씨
  const chip = (cls, label, note) => {
    const m = label.match(/^(.+?)(?::\s|\s·\s)(.+)$/);
    const body = m ? `<small>${m[1]}</small><b>${m[2]}</b>` : `<b>${label}</b>`;
    return `<button type="button" class="${cls}" aria-expanded="false" data-note="${esc(note)}"><span class="ct">${body}</span></button>`;
  };
  const full0 = (c) => (sur ? sur.ko : '') + c.given;
  const sndNote = (c) => T.sndNote(soundPath(full0(c), c.sound.ha), c.sound.ha === 'good');
  // 한자 음(소·영 등)은 번역기가 낱말(cow 등)로 옮기므로 번역하지 않게 묶는다
  const ON = (x) => `<span translate="no">${x.ko}</span>`;
  const cardHtml = (c, i) => {
    const chips = [];
    let why, hjLine = '';
    if (c.type === 'hanja') {
      const a = Object.assign({}, c.parts[0], { hun: T.hun(c.parts[0]) }), b = Object.assign({}, c.parts[1], { hun: T.hun(c.parts[1]) });
      // 한자와 그 뜻을 글자마다 한 칸에 묶는다. 칸 색은 아래 칩(가운데·끝 글자 기운) 색과 같다
      const tile = (x) => `<div class="glyph c${x.el}"><b class="g" translate="no">${x.h}</b><span class="gm">${T.tileMean(x, ON)}</span></div>`;
      hjLine = `<div class="glyphs">${tile(a)}${tile(b)}</div>`;
      chips.push(chip(`c${a.el}`, T.chipMid(EL[a.el]), T.elNote(true, a, EL[a.el])), chip(`c${b.el}`, T.chipEnd(EL[b.el]), T.elNote(false, b, EL[b.el])));
      chips.push(chip('', c.sound.ha === 'good' ? T.soundGood : T.soundFlat, sndNote(c)));
      if (sur) chips.push(chip('', c.suri.allGood ? T.suriAll(T.suriG(c.suri)) : T.suriSoft(T.suriG(c.suri)), T.suriNote(c.suri)));
      else chips.push(chip('', T.suriOne(c.suri.원격.n), T.suriOneNote(a, b, c.suri.원격)));
      const rel = T.relText[b.el === mother(a.el) ? 'mother' : b.el === a.el ? 'same' : 'calm'];
      why = T.whyHanja(a, b, elSpan(a.el), elSpan(b.el), rel, ON);
    } else {
      const mean = T.wMean(c);
      chips.push(chip(`c${c.el}`, T.chipW(EL[c.el]), T.noteW(mean, EL[c.el])),
        chip('', c.sound.ha === 'good' ? T.soundGood : T.soundFlat, sndNote(c)),
        chip('', T.noHanja, T.noHanjaNote));
      why = T.whyW(mean, elSpan(c.el));
    }
    const full = (sur ? sur.ko : '') + c.given;
    return `<article class="namecard${i === 0 ? ' sel' : ''}" data-i="${i}" tabindex="0">
      <span class="rank">${T.rank(i)}</span><span class="kind${c.type === 'woori' ? ' w' : ''}">${c.type === 'woori' ? T.kindW : T.kindH}</span>
      <div class="ko" translate="no">${esc(full)}</div><div class="ro" translate="no">${c.roman} (${c.romanH})</div>${hjLine}
      <p class="chiphint">${T.chipHint}</p><div class="chips">${chips.join('')}</div><p class="chipnote" hidden></p>
      <p class="why">${why}</p>
      <div class="act"><button type="button" data-say="${esc(full)}">${T.listen}</button></div></article>`;
  };
  $('p3').innerHTML = `<h2 id="p3h" class="rv"><span class="no" translate="no">2</span><span class="tt">${T.p3}</span></h2>
    <p class="muted rv">${T.p3Lead(mainW, EL[t.second])}</p>
    <div class="names">${names.map(cardHtml).join('')}</div>
    <div class="share"><p class="tiny" style="margin:0">${T.saveHint}</p><img id="shareimg" alt="">
      <div class="sharebtns"><button class="sbtn save" type="button" id="saveBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0-4.5-4.5M12 14l4.5-4.5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${T.save}</span></button><button class="sbtn send" type="button" id="sendBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10.1 15 12 3.4 13.9z" fill="currentColor"/></svg><span>${T.send}</span></button></div></div>`;
  const setShare = (i) => {
    document.querySelectorAll('.namecard').forEach((el) => el.classList.toggle('sel', +el.dataset.i === i));
    const c = names[i];
    const svg = shareSvg(c, sur, dm, t.main, t.counts[t.main] <= 1);
    $('shareimg').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    $('shareimg').alt = (sur ? sur.ko : '') + c.given;
    $('saveBtn').onclick = () => savePng(svg, `${(sur ? sur.ko : '') + c.given}.png`);
    $('sendBtn').onclick = () => sendPng(svg, `${(sur ? sur.ko : '') + c.given}.png`);
  };
  document.querySelectorAll('.namecard').forEach((el) => {
    el.addEventListener('click', (e) => {
      if (e.target.dataset.say) return;
      const b = e.target.closest('.chips button');
      if (b) {
        const open = b.getAttribute('aria-expanded') === 'true', note = el.querySelector('.chipnote');
        el.querySelectorAll('.chips button').forEach((x) => x.setAttribute('aria-expanded', 'false'));
        if (!open) { b.setAttribute('aria-expanded', 'true'); note.textContent = b.dataset.note; note.hidden = false; } else note.hidden = true;
        return;
      }
      setShare(+el.dataset.i);
    });
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') setShare(+el.dataset.i); });
  });
  document.querySelectorAll('[data-say]').forEach((b) => b.addEventListener('click', () => {
    if (!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(b.dataset.say); u.lang = 'ko-KR'; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }));
  setShare(0);

  // 더 알아보기: 우리가 정한 기준
  $('more').innerHTML = `<details><summary>${T.moreTitle}</summary><ol>${T.more.map((li) => `<li>${li}</li>`).join('')}</ol></details>`;
  reveal($('result'), keep);
  if (keep) window.scrollTo(0, y0);
}

/* ───────── 저장 카드 ───────── */
// lack: 넣을 기운이 사주에 0~1개면 '부족한', 2개 이상이면 '필요한'으로 쓴다 (2개 이상인데 부족하다고 쓰면 틀린 말이 된다)
function shareSvg(c, sur, dm, main, lack) {
  const col = C.ELC_DEEP[main];
  const full = (sur ? sur.ko : '') + c.given;
  const sub = c.type === 'hanja' ? c.h : T.shareWoori; // 영문 이름 옆 괄호: 이름 두 글자의 한자
  const romanLine = `${c.roman} (${sub})`, fill = T.shareFill(EL[main], lack);
  const mean = c.type === 'hanja' ? `${T.hun(c.parts[0])} ${c.parts[0].ko} · ${T.hun(c.parts[1])} ${c.parts[1].ko}` : T.wMean(c);
  // 사주 속 나의 모습: 오른쪽 칸(약 250px)에 두 줄까지. 띄어쓰기가 있으면 가운데에 가까운 빈칸에서 나눈다
  // 한글은 한 글자가 넓어 9자, 로마자는 18자를 넘으면 두 줄. 태국어는 띄어쓰기가 없어 한 줄로 두고 글자를 줄인다
  const me = T.stemMean[dm], meLines = wrap2(me, lang === 'ko' ? 9 : 18);
  const meSize = lang === 'th' ? (me.length > 24 ? 17 : 19) : meLines.some((l) => l.length > 20) ? 19 : 22;
  const nameSize = full.length > 3 ? 80 : 96;
  const titleSize = T.shareTitle.length > 24 ? 21 : 24;
  // 위: 남색 머리(코리케어 + 문장) / 가운데: 이름 / 아래: 사주 속 나의 모습
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" width="480" height="800">
  <defs><clipPath id="scClip"><rect x="4" y="4" width="472" height="792" rx="30"/></clipPath>
  <linearGradient id="scHead" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262f5a"/><stop offset="1" stop-color="#151a35"/></linearGradient></defs>
  <g clip-path="url(#scClip)"><rect width="480" height="800" fill="#f8f1e2"/><rect width="480" height="156" fill="url(#scHead)"/><rect y="156" width="480" height="5" fill="${col}"/></g>
  <rect x="4" y="4" width="472" height="792" rx="30" fill="none" stroke="#c9a457" stroke-width="6"/>
  <text x="240" y="64" text-anchor="middle" font-family="Noto Sans KR,sans-serif" font-size="15" font-weight="800" fill="#e0bd63" letter-spacing="6">KORI CARE</text>
  <text x="240" y="112" text-anchor="middle" font-family="Noto Serif KR,serif" font-size="${titleSize}" font-weight="700" fill="#f6eddb" letter-spacing="${lang === 'ko' ? 1 : 0}">${esc(T.shareTitle)}</text>
  <text x="240" y="${full.length > 3 ? 292 : 300}" text-anchor="middle" font-family="Noto Serif KR,serif" font-size="${nameSize}" font-weight="900" fill="#1f1a10" letter-spacing="8">${esc(full)}</text>
  <text x="240" y="354" text-anchor="middle" font-family="Noto Sans KR,sans-serif" font-size="${romanLine.length > 20 ? 25 : 28}" font-weight="800" fill="#2f2614">${esc(c.roman)} <tspan font-family="Noto Serif KR,serif" font-weight="500" fill="#5a4a2a">(${esc(sub)})</tspan></text>
  <text x="240" y="396" text-anchor="middle" font-family="Noto Sans KR,sans-serif" font-size="${mean.length > 22 ? 19 : 22}" font-weight="600" fill="#4a3c22">${esc(mean)}</text>
  <rect x="44" y="424" width="392" height="52" rx="26" fill="${col}"/>
  <text x="240" y="457" text-anchor="middle" font-family="Noto Sans KR,sans-serif" font-size="${fill.length > 34 ? 16 : fill.length > 24 ? 18 : 21}" font-weight="800" fill="#fff">${esc(fill)}</text>
  <rect x="44" y="510" width="392" height="196" rx="18" fill="#efe4cc"/>
  <g transform="translate(66 528) scale(.4)">${E.still(E.card(dm, T.stemName[dm], '')).replace('<svg ', '<svg width="240" height="400" ')}</g>
  <text x="188" y="${meLines.length > 1 ? 576 : 590}" font-family="Noto Sans KR,sans-serif" font-size="16" font-weight="800" fill="#8a6a2a" letter-spacing="${lang === 'ko' ? 1 : 0}">${esc(T.shareMe)}</text>
  ${meLines.map((l, i) => `<text x="188" y="${(meLines.length > 1 ? 612 : 626) + i * 32}" font-family="Noto Serif KR,serif" font-size="${meSize}" font-weight="800" fill="#1f1a10">${esc(l)}</text>`).join('')}
  <text x="240" y="752" text-anchor="middle" font-family="Noto Sans KR,sans-serif" font-size="17" font-weight="600" fill="#8a7448" letter-spacing="1">koricare.kr</text></svg>`;
}
// 한 줄이 길면 가운데에 가까운 빈칸에서 두 줄로 나눈다 (빈칸이 없는 말은 한 줄 그대로)
function wrap2(s, max) {
  if (s.length <= max || !s.includes(' ')) return [s];
  const mid = s.length / 2;
  let best = -1;
  for (let i = 0; i < s.length; i++) if (s[i] === ' ' && (best < 0 || Math.abs(i - mid) < Math.abs(best - mid))) best = i;
  return [s.slice(0, best), s.slice(best + 1)];
}
// 저장 카드 그림(SVG)을 PNG 로 바꾼다
function pngBlob(svg) {
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas'); cv.width = 960; cv.height = 1600;
      cv.getContext('2d').drawImage(img, 0, 0, 960, 1600);
      cv.toBlob((b) => (b ? ok(b) : fail(new Error('png'))), 'image/png');
    };
    img.onerror = fail;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
function downloadBlob(blob, file) {
  const a = document.createElement('a'); a.download = file; a.href = URL.createObjectURL(blob); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
// 아이폰·아이패드는 내려받으면 '파일' 앱으로 가서 사진첩에 안 들어간다. 공유창의 '이미지 저장'이 사진첩으로 넣어 준다
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
async function savePng(svg, file) {
  const b = await pngBlob(svg);
  const f = new File([b], file, { type: 'image/png' });
  if (isIOS && navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  downloadBlob(b, file); // 안드로이드: 'Download' 폴더에 저장되어 갤러리에도 보인다
  flashLabel($('saveBtn'), T.saved);
}
// 버튼 글자를 잠깐 바꿔 결과를 알린다 (설명 문단을 따로 두지 않는다)
function flashLabel(btn, label) {
  const keep = btn.innerHTML;
  btn.textContent = label; btn.disabled = true;
  setTimeout(() => { btn.innerHTML = keep; btn.disabled = false; }, 2400);
}

// 보내기: 받는 사람이 열 주소. 생년월일·시각은 넣지 않는다(보낸 사람 생일이 드러나지 않게)
const shareUrl = () => `https://www.koricare.kr/link/${lang === 'th' || lang === 'vi' ? lang + '/' : ''}korean-name/?${lang === 'ko' ? 'lang=ko&' : ''}ref=share`;
// 휴대폰 공유창(LINE·메신저·카카오톡·Zalo 등)을 연다. 공유창이 없는 브라우저는 이미지 저장 + 문장·주소 복사로 대신한다
async function sendPng(svg, file) {
  const text = `${T.shareText}\n${shareUrl()}`;
  let blob = null;
  try { blob = await pngBlob(svg); } catch (e) { /* 그림을 못 만들면 글과 주소만 보낸다 */ }
  const f = blob ? new File([blob], file, { type: 'image/png' }) : null;
  try {
    if (f && navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], text, title: T.brand }); return; }
    if (navigator.share) { await navigator.share({ text, title: T.brand }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; /* 그 밖의 실패는 아래 대체 방법으로 */ }
  let copied = false;
  try { await navigator.clipboard.writeText(text); copied = true; } catch (e) { /* 복사가 막힌 브라우저 */ }
  if (blob) downloadBlob(blob, file);
  flashLabel($('sendBtn'), copied ? T.shareCopied : T.shareSaved);
}

/* ───────── 언어 버튼: 첫 화면은 맨 위 줄 오른쪽, 결과 화면은 고정 막대 오른쪽 ───────── */
const langEl = $('lang'), langBtn = $('langBtn'), langMenu = $('langMenu');
langMenu.innerHTML = LANG_LIST.filter(([c]) => c === 'ko' || PACKS[c])
  .map(([c, name, code]) => `<li role="none"><button type="button" role="menuitemradio" data-l="${c}" lang="${c}" aria-checked="false"><span>${name}</span><small>${code}</small></button></li>`).join('');
function placeLang() { const slot = $('result').style.display === 'block' ? $('langSlot2') : $('langSlot1'); if (langEl.parentNode !== slot) slot.appendChild(langEl); }
function openMenu(open) {
  langMenu.hidden = !open; langBtn.setAttribute('aria-expanded', String(open));
  if (open) (langMenu.querySelector('[aria-checked="true"]') || langMenu.querySelector('button')).focus();
}
langBtn.addEventListener('click', () => openMenu(langMenu.hidden));
langMenu.addEventListener('click', (e) => { const b = e.target.closest('button[data-l]'); if (!b) return; openMenu(false); setLang(b.dataset.l); langBtn.focus(); });
langMenu.addEventListener('keydown', (e) => {
  const items = [...langMenu.querySelectorAll('button')], i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  if (e.key === 'Escape') { openMenu(false); langBtn.focus(); }
});
document.addEventListener('click', (e) => { if (!langMenu.hidden && !langEl.contains(e.target)) openMenu(false); });

function setLang(code, first) {
  if (code !== 'ko' && !PACKS[code]) code = 'ko';
  lang = code; T = code === 'ko' ? KO : Object.assign({}, KO, PACKS[code]); EL = T.el;
  document.documentElement.lang = code;
  // 고른 언어로 이미 옮긴 화면이므로 브라우저 자동 번역이 다시 끼어들지 않게 한다
  if (code === 'ko') document.documentElement.removeAttribute('translate'); else document.documentElement.setAttribute('translate', 'no');
  const cur = LANG_LIST.find(([c]) => c === code);
  $('langCode').textContent = cur[2];
  langBtn.setAttribute('aria-label', `${cur[1]} · Language`);
  langMenu.querySelectorAll('button').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.l === code)));
  try { if (!first) localStorage.setItem('kc_saju_lang', code); } catch (e) { /* 저장소가 막혀 있으면 기억만 못 한다 */ }
  applyStatic();
  buildIntro(!first);
  if (lastOut && $('result').style.display === 'block') render(lastOut, true);
}
setLang(pickLang(), true);
placeLang();
})();
</script>
