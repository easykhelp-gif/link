name: 1-Hour Auto News Scraper & Live Deployment

on:
  schedule:
    # 하루 1회. 6시간마다(하루 4회)였는데 그래도 모자랐다.
    #
    # 2026-09-07 에 API 가 뱉은 값으로 한도가 확정됐다.
    #   quotaId    GenerateRequestsPerDayPerProjectPerModel-FreeTier
    #   quotaValue 20        ← 분당이 아니라 하루 20회다
    # 기사 한 건에 호출이 2회(요약 + 시선) 들어가니 하루에 요약할 수 있는
    # 기사는 10건뿐이다. 하루 4회 실행 × 30건 = 240회를 던지고 있었다.
    #
    # 08:30 UTC 로 잡은 이유: 구글 일일 한도는 태평양 시간 자정에 풀리는 것으로
    # 알려져 있다. 여름(UTC-7)이든 겨울(UTC-8)이든 그 뒤가 되게 잡았다.
    # 다만 이 리셋 시각은 공식 문서로 확인한 것이 아니다 — 몇 회차 돌려보고
    # 요약 성공 건수가 매번 한도까지 차는지로 검증할 것.
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run 1-Hour News Scraper Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node auto_fetch_news.js
          node build_guides.js
          node check_links.js

      - name: Commit & Push Live News Updates
        run: |
          git config --global user.name "Theo Park AutoBot"
          git config --global user.email "koricare.help@gmail.com"
          git add data/ news/ en/guides/ th/guides/ vi/guides/ index.html th/ vi/ sitemap.xml templates/ || true
          if git diff-index --quiet HEAD --; then
            echo "바뀐 것이 없다."
            exit 0
          fi
          git commit -m "Auto: 1-Hour Live Trending News Update & Deploy"

          # 봇이 도는 사이 사람이 저장소에 올리면 원격이 앞서 있다.
          # 세 번까지 다시 붙여 본다.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "올렸다 (시도 $attempt)"
                exit 0
              fi
            else
              # index.html 한 파일에 봇 구역(NEWS_START~END, GUIDE_START~END)과
              # 사람 구역(검색창·OG 태그)이 같이 있다. 내용이 무관해도 같은 파일이면
              # git 은 충돌로 본다. 억지로 합치면 한쪽이 지워진다.
              #
              # 그래서 사람 파일을 그대로 받아 놓고 봇 구역만 다시 채운다.
              # 뉴스 목록은 data/news_list_*.json 에 이미 있으므로
              # Gemini 를 다시 부르지 않는다. 손실도 비용도 0이다.
              git rebase --abort || true
              mkdir -p /tmp/keep
              cp data/news_list_*.json /tmp/keep/ 2>/dev/null || true
              cp -r news/. /tmp/keep/news/ 2>/dev/null || true
              git reset --hard origin/main
              cp /tmp/keep/news_list_*.json data/ 2>/dev/null || true
              cp -r /tmp/keep/news/. news/ 2>/dev/null || true
              node build_guides.js
              node auto_fetch_news.js --inject-only
              git add data/ news/ en/guides/ th/guides/ vi/guides/ index.html th/ vi/ sitemap.xml templates/ || true
              if git diff-index --quiet HEAD --; then
                echo "다시 채우니 바뀐 것이 없다."
                exit 0
              fi
              git commit -m "Auto: 1-Hour Live Trending News Update & Deploy (재구성)"
              git push origin main
              echo "충돌했지만 봇 구역만 다시 채워 올렸다."
              exit 0
            fi
            sleep 15
          done
          echo "세 번 다 올리지 못했다."
          exit 1
