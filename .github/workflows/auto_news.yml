name: 1-Hour Auto News Scraper & Live Deployment

on:
  schedule:
    # Run every 4 hours (cron: '0 */4 * * *')
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 50

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run 1-Hour News Scraper Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node auto_fetch_news.js
          node build_guides.js
          node check_links.js

      - name: Commit & Push Live News Updates
        run: |
          git config --global user.name "Theo Park AutoBot"
          git config --global user.email "koricare.help@gmail.com"
          git add data/ news/ en/guides/ th/guides/ vi/guides/ index.html th/ vi/ sitemap.xml templates/ || true
          if git diff-index --quiet HEAD --; then
            echo "바뀐 것이 없다."
            exit 0
          fi
          git commit -m "Auto: 1-Hour Live Trending News Update & Deploy"

          # 봇이 도는 사이 사람이 저장소에 올리면 원격이 앞서 있다.
          # 세 번까지 다시 붙여 본다.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "올렸다 (시도 $attempt)"
                exit 0
              fi
            else
              # 생성물이 사람 커밋과 충돌했다. 억지로 합치면 사람이 고친 것을 덮어쓴다.
              # 뉴스는 다음 회차에 다시 만들어지므로 이번 것은 버린다. 실패가 아니다.
              git rebase --abort || true
              git reset --hard origin/main
              echo "사람 커밋과 충돌. 이번 회차는 건너뛴다."
              exit 0
            fi
            sleep 15
          done
          echo "세 번 다 올리지 못했다."
          exit 1
