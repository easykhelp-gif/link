name: 1-Hour Auto News Scraper & Live Deployment

on:
  schedule:
    # Run every 1 hour (cron: '0 * * * *')
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run 1-Hour News Scraper Engine
        run: |
          node auto_fetch_news.js

      - name: Commit & Push Live News Updates
        run: |
          git config --global user.name "Theo Park AutoBot"
          git config --global user.email "koricare.help@gmail.com"
          git add data/ news/ index.html th/ vi/ sitemap.xml templates/ || true
          git diff-index --quiet HEAD || (git pull --rebase origin main || true && git commit -m "Auto: 1-Hour Live Trending News Update & Deploy" && git push origin main)
