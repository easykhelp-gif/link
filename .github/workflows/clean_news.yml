name: 3-Day Old News Auto Cleanup

on:
  schedule:
    # 19:00 UTC = 04:00 KST
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Run Cleanup Script
        run: node clean_old_news.js
          
      - name: Commit & Push Deleted Files
        run: |
          git config --global user.name "Theo Park AutoBot"
          git config --global user.email "koricare.help@gmail.com"
          git add news/ || true
          if git diff-index --quiet HEAD --; then
            echo "바뀐 것이 없다."
            exit 0
          fi
          git commit -m "Auto: Delete news older than 3 days"

          # 봇이 도는 사이 사람이 저장소에 올리면 원격이 앞서 있다.
          # 세 번까지 다시 붙여 본다.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "올렸다 (시도 $attempt)"
                exit 0
              fi
            else
              # 생성물이 사람 커밋과 충돌했다. 억지로 합치면 사람이 고친 것을 덮어쓴다.
              # 뉴스는 다음 회차에 다시 만들어지므로 이번 것은 버린다. 실패가 아니다.
              git rebase --abort || true
              git reset --hard origin/main
              echo "사람 커밋과 충돌. 이번 회차는 건너뛴다."
              exit 0
            fi
            sleep 15
          done
          echo "세 번 다 올리지 못했다."
          exit 1
