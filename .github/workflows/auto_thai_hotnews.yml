name: Auto Thai HotNews Pipeline (Cloud 24/7)

# 2026-09-01 자동 실행 중지.
#
# 두 가지 이유다.
#   ① 소스가 카오솟·사눅·타이랏 — 태국 국내 뉴스다.
#      한국 사는 태국인에게 쓸모가 없어 auto_fetch_news.js 를 한국 뉴스로
#      바꿨는데, 이 파이프라인만 옛 소스를 그대로 긁고 있었다.
#   ② 결과물이 화면에 걸리지 않는다.
#      auto_fetch_news.js 가 같은 자리(th/index.html 뉴스 칸)를 덮어쓴다.
#      나중에 도는 쪽이 이겨서, 4시간마다 만든 36장이 아무도 못 본 채
#      고아 파일로 쌓이다 정리에서 지워지고 있었다.
#
# 스크립트는 남겨 둔다. 다시 쓸 일이 있으면 아래 schedule 을 되살리면 된다.
on:
  workflow_dispatch: # 수동 실행만

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Thai HotNews Auto-Pipeline
        run: |
          node build_thai_hotnews.js

      - name: Commit and Push Updated News & Images
        run: |
          git config --global user.name "KoriCare AutoBot"
          git config --global user.email "bot@koricare.kr"
          git add data/ news/ index.html th/ vi/ sitemap.xml templates/ || true
          if git diff-index --quiet HEAD --; then
            echo "바뀐 것이 없다."
            exit 0
          fi
          git commit -m "Auto-update Thai HotNews Top 3 & Images [Cloud System]"

          # 봇이 도는 사이 사람이 저장소에 올리면 원격이 앞서 있다.
          # 세 번까지 다시 붙여 본다.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin main; then
                echo "올렸다 (시도 $attempt)"
                exit 0
              fi
            else
              # 생성물이 사람 커밋과 충돌했다. 억지로 합치면 사람이 고친 것을 덮어쓴다.
              # 뉴스는 다음 회차에 다시 만들어지므로 이번 것은 버린다. 실패가 아니다.
              git rebase --abort || true
              git reset --hard origin/main
              echo "사람 커밋과 충돌. 이번 회차는 건너뛴다."
              exit 0
            fi
            sleep 15
          done
          echo "세 번 다 올리지 못했다."
          exit 1